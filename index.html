<!doctype html>
<html lang="zh-CN" data-theme="tech-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RD Remote</title>
    <!-- 同步内联脚本：在首次绘制前从 localStorage 读取保存的主题，
         避免先闪默认 tech-dark 再跳到用户设定主题的问题。
         必须在 <style> 之前执行，使 data-theme 属性在内联样式求值时已正确。 -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('app_theme');
          if (saved) {
            // 预设主题直接写入 data-theme
            if (saved === 'tech-dark' || saved === 'dark' || saved === 'light' || saved === 'eye-care-green') {
              document.documentElement.setAttribute('data-theme', saved);
            } else if (saved === 'system') {
              // system 主题：根据系统偏好设置
              var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
              document.documentElement.setAttribute('data-theme', prefersLight ? 'light' : 'tech-dark');
            } else if (saved.indexOf('custom-') === 0) {
              // 自定义主题：读取自定义主题数据获取 extends 预设
              var raw = localStorage.getItem('app_custom_themes');
              if (raw) {
                var themes = JSON.parse(raw);
                if (Array.isArray(themes)) {
                  var ct = themes.find(function (t) { return t.id === saved; });
                  if (ct && ct.extends) {
                    document.documentElement.setAttribute('data-theme', ct.extends);
                  }
                }
              }
            }
          }
        } catch (e) { /* ignore */ }
      })();
    </script>
    <!-- 预挂载基础样式：在 JS/CSS bundle 加载完之前也能保持正确的背景色，
         避免先闪白再变黑，同时在 #root 里放纯 HTML/CSS 的启动 splash。
         React 的 createRoot().render() 会整体替换 #root 的内容。 -->
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      /* 按主题设置基础背景色，与 data-theme 属性同步生效 */
      html[data-theme="tech-dark"], html[data-theme="dark"] {
        background: #050810;
        color: #d4def3;
      }
      html[data-theme="light"], html[data-theme="eye-care-green"] {
        background: #f5f5f7;
        color: #1d1d1f;
      }
      html, body {
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", "Segoe UI", sans-serif;
      }
      /* pre-splash 始终使用深色风格（启动加载界面），不受主题影响 */
      .pre-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background:
          radial-gradient(1400px 700px at 0% 0%, rgba(10, 132, 255, 0.09), transparent 60%),
          radial-gradient(1100px 600px at 110% 110%, rgba(88, 86, 214, 0.08), transparent 60%),
          #050810;
      }
      .pre-splash-logo {
        width: 56px; height: 56px;
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #00D4FF 0%, #5856D6 100%);
        color: white;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.5px;
        box-shadow: 0 8px 32px rgba(0, 212, 255, 0.18);
      }
      .pre-splash-spinner {
        width: 22px; height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(212, 222, 243, 0.18);
        border-top-color: #00D4FF;
        animation: pre-spin 0.9s linear infinite;
      }
      @keyframes pre-spin {
        to { transform: rotate(360deg); }
      }
      .pre-splash-text {
        font-size: 12px;
        color: rgba(212, 222, 243, 0.62);
        letter-spacing: 0.5px;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="pre-splash">
        <div class="pre-splash-logo">RD</div>
        <div class="pre-splash-spinner"></div>
        <div class="pre-splash-text">正在加载…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
