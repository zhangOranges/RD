<!doctype html>
<html lang="zh-CN" data-theme="tech-dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RD Remote</title>
    <!-- 预挂载基础样式：在 JS/CSS bundle 加载完之前也能保持正确的背景色，
         避免先闪白再变黑，同时在 #root 里放纯 HTML/CSS 的启动 splash。
         React 的 createRoot().render() 会整体替换 #root 的内容。 -->
    <style>
      html, body, #root {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      html, body {
        background: #050810;
        color: #d4def3;
        font-family: -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", "Segoe UI", sans-serif;
      }
      .pre-splash {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background:
          radial-gradient(1400px 700px at 0% 0%, rgba(10, 132, 255, 0.09), transparent 60%),
          radial-gradient(1100px 600px at 110% 110%, rgba(88, 86, 214, 0.08), transparent 60%),
          #050810;
      }
      .pre-splash-logo {
        width: 56px; height: 56px;
        border-radius: 14px;
        display: flex; align-items: center; justify-content: center;
        background: linear-gradient(135deg, #00D4FF 0%, #5856D6 100%);
        color: white;
        font-weight: 700;
        font-size: 22px;
        letter-spacing: 0.5px;
        box-shadow: 0 8px 32px rgba(0, 212, 255, 0.18);
      }
      .pre-splash-spinner {
        width: 22px; height: 22px;
        border-radius: 50%;
        border: 2px solid rgba(212, 222, 243, 0.18);
        border-top-color: #00D4FF;
        animation: pre-spin 0.9s linear infinite;
      }
      @keyframes pre-spin {
        to { transform: rotate(360deg); }
      }
      .pre-splash-text {
        font-size: 12px;
        color: rgba(212, 222, 243, 0.62);
        letter-spacing: 0.5px;
      }
    </style>
  </head>

  <body>
    <div id="root">
      <div class="pre-splash">
        <div class="pre-splash-logo">RD</div>
        <div class="pre-splash-spinner"></div>
        <div class="pre-splash-text">正在加载…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
