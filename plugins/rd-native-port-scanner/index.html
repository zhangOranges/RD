<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>端口扫描</title>
<style>
  /* ============================================================
   * RD 内置插件：端口扫描（rd-native-port-scanner）
   * —— 基础样式由主程序注入的 PLUGIN_COMMON_CSS 提供（.rd-* / .btn / .form-* 等）
   * —— 本文件只声明端口扫描独有的布局 / 业务样式
   * —— 颜色使用主题 CSS 变量，自动适配深浅色
   * ============================================================ */

  /* ---------- 顶栏 ---------- */
  .ps-header {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--divider-soft, rgba(127,127,127,0.18));
  }
  .ps-actions { display: flex; align-items: center; gap: 8px; }

  /* ---------- 工具栏 ---------- */
  .ps-toolbar {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--divider-soft, rgba(127,127,127,0.12));
    flex-wrap: wrap;
  }
  .ps-toolbar .form-select,
  .ps-toolbar .form-input {
    height: 30px;
    line-height: 1.2;
    padding: 4px 10px;
    box-sizing: border-box;
    transition: border-color 120ms ease, box-shadow 120ms ease, background 120ms ease;
  }
  .ps-toolbar .form-input { flex: 1 1 160px; min-width: 120px; }

  /* ---------- 表格区 ---------- */
  .ps-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 16px 16px; }

  .ps-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .ps-table thead th {
    position: sticky; top: 0; z-index: 1;
    background: var(--bg-content, #14161a);
    text-align: left;
    padding: 8px 10px;
    font-weight: 600;
    font-size: 11.5px;
    color: var(--text-tertiary, #9a9aa2);
    border-bottom: 1px solid var(--divider-soft, rgba(127,127,127,0.18));
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  .ps-table thead th:hover { color: var(--text-primary, #e4e4e7); }
  .ps-table thead th .sort-arrow { opacity: 0.4; font-size: 9px; margin-left: 3px; }
  .ps-table thead th.sort-active .sort-arrow { opacity: 1; color: var(--accent, #5b8cff); }

  .ps-table tbody tr {
    border-bottom: 1px solid var(--divider-soft, rgba(127,127,127,0.08));
    transition: background 100ms ease;
  }
  .ps-table tbody tr:hover { background: var(--bg-hover, rgba(127,127,127,0.08)); }
  .ps-table tbody td {
    padding: 7px 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .ps-table tbody td.col-process { white-space: normal; word-break: break-all; }

  /* 状态标签 */
  .ps-badge {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 1px 7px;
    border-radius: 4px;
    font-size: 10.5px;
    font-weight: 600;
    line-height: 1.4;
  }
  .ps-badge-tcp { background: rgba(91,140,255,0.15); color: #5b8cff; }
  .ps-badge-udp { background: rgba(168,85,247,0.15); color: #a855f7; }
  .ps-badge-listen { background: rgba(34,197,94,0.15); color: #22c55e; }
  .ps-badge-estab { background: rgba(245,158,11,0.15); color: #f59e0b; }

  /* 端口号突出 */
  .ps-port { font-family: 'SF Mono', 'Cascadia Code', monospace; font-weight: 600; }

  /* ---------- 空状态 ---------- */
  .ps-empty {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    height: 100%; gap: 10px;
    color: var(--text-tertiary, #9a9aa2);
  }
  .ps-empty-icon { font-size: 32px; opacity: 0.5; }
  .ps-empty-text { font-size: 13px; }

  /* ---------- 加载状态 ---------- */
  .ps-loading {
    display: flex; align-items: center; justify-content: center;
    height: 100%; gap: 8px;
    color: var(--text-tertiary, #9a9aa2);
    font-size: 13px;
  }
  .ps-spinner {
    width: 16px; height: 16px;
    border: 2px solid var(--divider-soft, rgba(127,127,127,0.2));
    border-top-color: var(--accent, #5b8cff);
    border-radius: 50%;
    animation: ps-spin 0.7s linear infinite;
  }
  @keyframes ps-spin { to { transform: rotate(360deg); } }

  /* ---------- 统计栏 ---------- */
  .ps-stats {
    display: flex; gap: 14px;
    font-size: 11.5px; color: var(--text-tertiary, #9a9aa2);
  }
  .ps-stats span strong { color: var(--text-primary, #e4e4e7); font-weight: 600; }

  /* ---------- 错误提示 ---------- */
  .ps-error {
    margin: 12px 16px;
    padding: 10px 14px;
    border-radius: 8px;
    background: rgba(239,68,68,0.1);
    border: 1px solid rgba(239,68,68,0.25);
    color: #ef4444;
    font-size: 12.5px;
    line-height: 1.5;
    word-break: break-all;
  }
</style>
</head>
<body style="display:flex;flex-direction:column;height:100vh;">

<!-- ========== 顶栏 ========== -->
<div class="ps-header">
  <div class="ps-sub" style="font-size:14px;font-weight:600;">端口扫描</div>
  <div class="ps-actions">
    <button class="btn" id="btnRefresh" title="刷新端口列表">刷新</button>
  </div>
</div>

<!-- ========== 工具栏 ========== -->
<div class="ps-toolbar">
  <select class="form-select" id="hostSelect" style="min-width:160px;">
    <option value="">选择主机…</option>
  </select>

  <select class="form-select" id="protoFilter" style="min-width:90px;">
    <option value="all">全部协议</option>
    <option value="tcp">TCP</option>
    <option value="udp">UDP</option>
  </select>

  <select class="form-select" id="stateFilter" style="min-width:100px;">
    <option value="all">全部状态</option>
    <option value="LISTEN">监听</option>
    <option value="ESTAB">已连接</option>
    <option value="TIME-WAIT">TIME-WAIT</option>
    <option value="UNCONN">未连接</option>
  </select>

  <input class="form-input" id="searchInput" type="text" placeholder="过滤端口 / 地址 / 进程…" />

  <div class="ps-stats" id="statsBar"></div>
</div>

<!-- ========== 错误提示 ========== -->
<div class="ps-error" id="errorBar" style="display:none;"></div>

<!-- ========== 表格区 ========== -->
<div class="ps-body" id="tableBody">
  <div class="ps-empty">
    <div class="ps-empty-icon">📡</div>
    <div class="ps-empty-text">选择一台主机后自动扫描</div>
  </div>
</div>

<script>
(function() {
  'use strict';

  // ====== 与端口转发插件完全一致的初始化顺序 ======
  var R = window.__rdPlugin;
  var ctx = R.ctx;
  var PLUGIN_ID = R.getPluginId();

  var errMsg = function (e) { return (e && e.message) || String(e); };
  function log(level, msg) {
    try { ctx.log[level]('[' + PLUGIN_ID + '] ' + msg); } catch (e) { /* ignore */ }
  }
  function notify(kind, msg) {
    try { ctx.ui.notify(kind, msg); } catch (e) { /* ignore */ }
  }

  // ====== 状态 ======
  let hosts = [];
  let rawPorts = [];        // 原始解析结果
  let filteredPorts = [];   // 过滤后结果
  let loading = false;
  let sortKey = 'port';
  let sortDir = 'asc';
  var viewIsOpen = false;
  var busUnsubs = [];

  // ====== DOM ======
  var hostSelect = document.getElementById('hostSelect');
  var protoFilter = document.getElementById('protoFilter');
  var stateFilter = document.getElementById('stateFilter');
  var searchInput = document.getElementById('searchInput');
  var statsBar = document.getElementById('statsBar');
  var errorBar = document.getElementById('errorBar');
  var tableBody = document.getElementById('tableBody');
  var btnRefresh = document.getElementById('btnRefresh');

  // ====== 工具函数（用 var 避免与全局 el 冲突） ======
  function el(tag, props, children) {
    var e = document.createElement(tag);
    if (props) {
      for (var k in props) {
        if (k === 'style') Object.assign(e.style, props[k]);
        else if (k === 'class') e.className = props[k];
        else if (k.startsWith('data-')) e.setAttribute(k, props[k]);
        else e[k] = props[k];
      }
    }
    if (children) {
      (Array.isArray(children) ? children : [children]).forEach(function (c) {
        if (c == null) return;
        e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
      });
    }
    return e;
  }

  function showError(msg) {
    errorBar.textContent = msg;
    errorBar.style.display = msg ? 'block' : 'none';
  }

  function showEmpty(icon, text) {
    tableBody.innerHTML = '';
    tableBody.appendChild(el('div', { class: 'ps-empty' }, [
      el('div', { class: 'ps-empty-icon' }, icon),
      el('div', { class: 'ps-empty-text' }, text),
    ]));
  }

  function showLoading(text) {
    tableBody.innerHTML = '';
    tableBody.appendChild(el('div', { class: 'ps-loading' }, [
      el('div', { class: 'ps-spinner' }),
      text || '正在扫描端口…',
    ]));
  }

  // ====== 解析 ss/netstat 输出 ======
  // 统一的端口记录结构
  // { proto, state, localAddr, localPort, peerAddr, peerPort, process }
  function parseSsOutput(output) {
    const results = [];
    const lines = output.split('\n');
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith('Netid') || trimmed.startsWith('State')) continue;
      // ss -tunlp 输出格式：
      // Netid State  Recv-Q Send-Q Local Address:Port Peer Address:Port Process
      // tcp   LISTEN 0      128    0.0.0.0:22        0.0.0.0:*       users:(("sshd",pid=1234,fd=3))
      // udp   UNCONN 0      0      0.0.0.0:68         0.0.0.0:*       users:(("dhclient",pid=5678,fd=8))
      const parts = trimmed.split(/\s+/);
      if (parts.length < 5) continue;

      const proto = parts[0].toLowerCase();
      const state = parts[1];
      const local = parts[4];
      const peer = parts.length > 5 ? parts[5] : '*:*';

      // 解析地址:端口
      const localMatch = local.match(/^(.+):(\d+)$/);
      if (!localMatch) continue;
      const localAddr = localMatch[1].replace(/^\[/, '').replace(/\]$/, ''); // 去 IPv6 方括号
      const localPort = parseInt(localMatch[2], 10);
      if (isNaN(localPort)) continue;

      const peerMatch = peer.match(/^(.+):(\d+|\*)$/);
      const peerAddr = peerMatch ? peerMatch[1].replace(/^\[/, '').replace(/\]$/, '') : '*';
      const peerPort = peerMatch && peerMatch[2] !== '*' ? parseInt(peerMatch[2], 10) : null;

      // 进程信息（ss -p 输出）
      let process = '';
      const procIdx = trimmed.indexOf('users:((');
      if (procIdx >= 0) {
        const procStr = trimmed.slice(procIdx);
        const nameMatch = procStr.match(/users:\(\("([^"]+)"/);
        const pidMatch = procStr.match(/pid=(\d+)/);
        if (nameMatch) {
          process = nameMatch[1];
          if (pidMatch) process += ` (PID: ${pidMatch[1]})`;
        }
      }

      results.push({
        proto, state,
        localAddr, localPort,
        peerAddr, peerPort,
        process,
      });
    }
    return results;
  }

  function parseNetstatOutput(output) {
    const results = [];
    const lines = output.split('\n');
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed || trimmed.startsWith('Proto') || trimmed.startsWith('Active')) continue;
      // netstat -tunlp 输出格式：
      // Proto Recv-Q Send-Q Local Address Foreign Address State PID/Program name
      // tcp   0      0      0.0.0.0:22   0.0.0.0:*       LISTEN 1234/sshd
      const parts = trimmed.split(/\s+/);
      if (parts.length < 6) continue;

      const proto = parts[0].toLowerCase();
      const local = parts[3];
      const peer = parts[4];
      const state = parts[5];
      const procPart = parts.length > 6 ? parts.slice(6).join(' ') : '';

      const localMatch = local.match(/^(.+):(\d+)$/);
      if (!localMatch) continue;
      const localAddr = localMatch[1].replace(/^\[/, '').replace(/\]$/, '');
      const localPort = parseInt(localMatch[2], 10);
      if (isNaN(localPort)) continue;

      const peerMatch = peer.match(/^(.+):(\d+|\*)$/);
      const peerAddr = peerMatch ? peerMatch[1].replace(/^\[/, '').replace(/\]$/, '') : '*';
      const peerPort = peerMatch && peerMatch[2] !== '*' ? parseInt(peerMatch[2], 10) : null;

      // 进程信息（PID/Program name 格式）
      let process = '';
      const procMatch = procPart.match(/^(\d+)\/(.+)/);
      if (procMatch) {
        process = `${procMatch[2]} (PID: ${procMatch[1]})`;
      } else if (procPart && procPart !== '-') {
        process = procPart;
      }

      results.push({
        proto, state,
        localAddr, localPort,
        peerAddr, peerPort,
        process,
      });
    }
    return results;
  }

  // ====== 扫描端口 ======
  async function scanPorts(hostId) {
    if (!hostId) { showEmpty('📡', '选择一台主机后自动扫描'); return; }
    if (!ctx) { showEmpty('📡', '插件初始化中…'); return; }

    loading = true;
    showLoading('正在扫描端口…');
    showError('');

    try {
      // 优先用 ss（现代 Linux 标配），回退到 netstat
      let output = '';
      let usedFallback = false;

      const ssResult = await ctx.ssh.exec(hostId, 'ss -tunlp 2>/dev/null', { timeoutMs: 15000 });
      if (ssResult.success && ssResult.output && ssResult.output.trim()) {
        output = ssResult.output;
      } else {
        // 回退到 netstat
        usedFallback = true;
        const nsResult = await ctx.ssh.exec(hostId, 'netstat -tunlp 2>/dev/null', { timeoutMs: 15000 });
        if (!nsResult.success) {
          throw new Error(nsResult.output || '命令执行失败');
        }
        output = nsResult.output;
      }

      // 解析输出
      let ports = usedFallback ? parseNetstatOutput(output) : parseSsOutput(output);

      if (ports.length === 0 && !usedFallback) {
        // ss 解析为空，可能是老系统，尝试 netstat
        const nsResult = await ctx.ssh.exec(hostId, 'netstat -tunlp 2>/dev/null', { timeoutMs: 15000 });
        if (nsResult.success && nsResult.output && nsResult.output.trim()) {
          ports = parseNetstatOutput(nsResult.output);
        }
      }

      rawPorts = ports;
      loading = false;
      applyFilters();

      log('info', '端口扫描完成: host=' + hostId + ' 共 ' + ports.length + ' 条记录');
      notify('success', '扫描完成：发现 ' + ports.length + ' 个端口');
    } catch (e) {
      loading = false;
      var msg = errMsg(e);
      showError('扫描失败：' + msg);
      showEmpty('❌', '扫描失败，请检查主机连接');
      log('error', '端口扫描失败: ' + msg);
      notify('error', '扫描失败：' + msg);
    }
  }

  // ====== 过滤 + 排序 ======
  function applyFilters() {
    const proto = protoFilter.value;
    const stateVal = stateFilter.value;
    const search = searchInput.value.trim().toLowerCase();

    filteredPorts = rawPorts.filter(p => {
      if (proto !== 'all' && p.proto !== proto) return false;
      if (stateVal !== 'all' && !p.state.toUpperCase().includes(stateVal.toUpperCase())) return false;
      if (search) {
        const hay = `${p.proto} ${p.state} ${p.localAddr} ${p.localPort} ${p.peerAddr || ''} ${p.peerPort || ''} ${p.process}`.toLowerCase();
        if (!hay.includes(search)) return false;
      }
      return true;
    });

    // 排序
    filteredPorts.sort((a, b) => {
      let va, vb;
      switch (sortKey) {
        case 'port': va = a.localPort; vb = b.localPort; break;
        case 'proto': va = a.proto; vb = b.proto; break;
        case 'state': va = a.state; vb = b.state; break;
        case 'addr': va = a.localAddr; vb = b.localAddr; break;
        case 'process': va = a.process || ''; vb = b.process || ''; break;
        default: va = a.localPort; vb = b.localPort;
      }
      if (typeof va === 'number' && typeof vb === 'number') {
        return sortDir === 'asc' ? va - vb : vb - va;
      }
      const sa = String(va), sb = String(vb);
      return sortDir === 'asc' ? sa.localeCompare(sb) : sb.localeCompare(sa);
    });

    renderTable();
    renderStats();
  }

  // ====== 渲染表格 ======
  function renderTable() {
    if (loading) return;
    if (filteredPorts.length === 0) {
      showEmpty('🔍', rawPorts.length === 0 ? '未检测到开放端口' : '无匹配结果');
      return;
    }

    tableBody.innerHTML = '';

    const protoLabel = sortKey === 'proto' ? 'sort-active' : '';
    const stateLabel = sortKey === 'state' ? 'sort-active' : '';
    const portLabel = sortKey === 'port' ? 'sort-active' : '';
    const addrLabel = sortKey === 'addr' ? 'sort-active' : '';
    const procLabel = sortKey === 'process' ? 'sort-active' : '';
    const arrow = sortDir === 'asc' ? '▲' : '▼';

    const table = el('table', { class: 'ps-table' }, [
      el('thead', {}, el('tr', {}, [
        el('th', { class: protoLabel, onclick: () => toggleSort('proto') }, [
          '协议', el('span', { class: 'sort-arrow' }, protoLabel ? arrow : '↕'),
        ]),
        el('th', { class: stateLabel, onclick: () => toggleSort('state') }, [
          '状态', el('span', { class: 'sort-arrow' }, stateLabel ? arrow : '↕'),
        ]),
        el('th', { class: addrLabel, onclick: () => toggleSort('addr') }, [
          '本地地址', el('span', { class: 'sort-arrow' }, addrLabel ? arrow : '↕'),
        ]),
        el('th', { class: portLabel, onclick: () => toggleSort('port') }, [
          '端口', el('span', { class: 'sort-arrow' }, portLabel ? arrow : '↕'),
        ]),
        el('th', {}, '远程地址'),
        el('th', {}, '远程端口'),
        el('th', { class: procLabel, onclick: () => toggleSort('process') }, [
          '进程', el('span', { class: 'sort-arrow' }, procLabel ? arrow : '↕'),
        ]),
      ])),
    ]);

    const tbody = el('tbody', {});
    for (const p of filteredPorts) {
      const isTcp = p.proto === 'tcp';
      const isListen = p.state === 'LISTEN' || p.state === 'UNCONN';

      const protoBadge = el('span', {
        class: `ps-badge ${isTcp ? 'ps-badge-tcp' : 'ps-badge-udp'}`,
      }, p.proto.toUpperCase());

      const stateBadge = el('span', {
        class: `ps-badge ${isListen ? 'ps-badge-listen' : 'ps-badge-estab'}`,
      }, p.state);

      tbody.appendChild(el('tr', {}, [
        el('td', {}, protoBadge),
        el('td', {}, stateBadge),
        el('td', {}, p.localAddr),
        el('td', {}, el('span', { class: 'ps-port' }, String(p.localPort))),
        el('td', {}, p.peerAddr || '*'),
        el('td', {}, p.peerPort != null ? String(p.peerPort) : '*'),
        el('td', { class: 'col-process' }, p.process || '—'),
      ]));
    }
    table.appendChild(tbody);
    tableBody.innerHTML = '';
    tableBody.appendChild(table);
  }

  function renderStats() {
    const tcp = filteredPorts.filter(p => p.proto === 'tcp').length;
    const udp = filteredPorts.filter(p => p.proto === 'udp').length;
    const listen = filteredPorts.filter(p => p.state === 'LISTEN' || p.state === 'UNCONN').length;
    statsBar.innerHTML = '';
    statsBar.appendChild(el('span', {}, ['共 ', el('strong', {}, String(filteredPorts.length)), ' 条']));
    statsBar.appendChild(el('span', {}, ['TCP ', el('strong', {}, String(tcp))]));
    statsBar.appendChild(el('span', {}, ['UDP ', el('strong', {}, String(udp))]));
    statsBar.appendChild(el('span', {}, ['监听 ', el('strong', {}, String(listen))]));
  }

  function toggleSort(key) {
    if (sortKey === key) {
      sortDir = sortDir === 'asc' ? 'desc' : 'asc';
    } else {
      sortKey = key;
      sortDir = 'asc';
    }
    applyFilters();
  }

  // ====== 加载主机列表 ======
  // 与端口转发插件一致：未连接主机在下拉中禁用并标注「未连接」
  async function loadHosts() {
    try {
      var all = await ctx.server.listAll();
      var states = await Promise.all(all.map(function (h) {
        return ctx.server.getConnectionState(h.id).catch(function () { return 'disconnected'; });
      }));
      hosts = all;
      hostSelect.innerHTML = '';
      hostSelect.appendChild(el('option', { value: '' }, '选择主机…'));
      for (var i = 0; i < all.length; i++) {
        var h = all[i];
        var st = states[i] || 'disconnected';
        var connected = st === 'connected';
        var label = h.name + ' (' + h.host + ':' + h.port + ')' + (connected ? '' : ' · 未连接');
        // 未连接的 option 设为 disabled，用户无法选中
        var opt = el('option', { value: h.id, disabled: !connected }, label);
        if (!connected) opt.style.color = 'var(--text-tertiary, #9a9aa2)';
        hostSelect.appendChild(opt);
      }
      log('info', '主机列表加载完成: total=' + all.length + ' connected=' + all.filter(function (_, j) { return states[j] === 'connected'; }).length);
    } catch (e) {
      var msg = errMsg(e);
      showError('加载主机列表失败：' + msg);
      log('warn', '加载主机列表失败: ' + msg);
    }
  }

  // ====== 事件绑定 ======
  function bind() {
    hostSelect.addEventListener('change', function () {
      var hostId = hostSelect.value;
      if (hostId) void scanPorts(hostId);
      else showEmpty('📡', '选择一台主机后自动扫描');
    });
    protoFilter.addEventListener('change', applyFilters);
    stateFilter.addEventListener('change', applyFilters);
    searchInput.addEventListener('input', applyFilters);
    btnRefresh.addEventListener('click', function () {
      var hostId = hostSelect.value;
      if (hostId) void scanPorts(hostId);
    });
  }
  bind();

  // ---------------- 生命周期（完全对齐端口转发） ----------------
  R.on({
    init: async function () {
      log('info', '插件初始化（init）');
      try {
        await ctx.ui.registerToolbarButton({
          id: 'port-scanner-open',
          label: '端口扫描',
          tooltip: '查询服务器开启的端口（内置插件）',
          group: 'center',
          onClick: function () { return ctx.ui.openPluginView(); },
        });
        log('info', '工具栏按钮已注册');
      } catch (e) {
        log('error', '注册工具栏按钮失败: ' + errMsg(e));
      }
    },
    enable: async function () {
      log('info', '插件启用（enable）');
      busUnsubs.push(R.onBus('connection:success', function () { void loadHosts(); }));
      busUnsubs.push(R.onBus('connection:reconnect-success', function () { void loadHosts(); }));
      log('info', '已订阅事件: connection:success / reconnect-success');
      await loadHosts();
    },
    disable: async function () {
      log('info', '插件禁用（disable）');
      busUnsubs.forEach(function (u) { try { u(); } catch (e) { /* ignore */ } });
      busUnsubs = [];
      if (viewIsOpen) {
        try { await ctx.ui.closePluginView(); } catch (e) { /* ignore */ }
        viewIsOpen = false;
      }
    },
    uninstall: async function () {
      log('info', '插件卸载（uninstall）');
    },
  });

  // 监听视图打开/关闭
  var host = document.body.parentElement;
  if (host && typeof MutationObserver !== 'undefined') {
    new MutationObserver(function () {
      var anyOpen = !host.classList.contains('rd-view-hidden');
      var wasOpen = viewIsOpen;
      viewIsOpen = anyOpen;
      if (anyOpen && !wasOpen) {
        // 视图刚打开：刷新主机列表
        void loadHosts();
      }
    }).observe(host, { attributes: true, attributeFilter: ['class'] });
  }
})();
</script>
</body>
</html>
