[package]
name = "rd-app"
version = "0.1.68"
description = "RD - SSH/SFTP Remote Desktop"
authors = ["orange"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
russh = "0.45"
russh-sftp = "2.0"
async-trait = "0.1"
keyring = "3"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
thiserror = "1"
dirs = "5"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
futures-util = "0.3"
tauri-plugin-clipboard-manager = "2.3.2"
tauri-plugin-window-state = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
chrono = "0.4"
ttf-parser = "0.25"

# ========== 新增编译优化配置（解决CI无法增量编译、减小包体积） ==========
[profile.release]
# 开启release模式增量编译，rust-cache才能实现增量复用
incremental = true
# 最高优化等级
opt-level = 3
# 全局链接时优化，大幅缩减二进制体积
lto = true
# 单代码生成单元，配合LTO进一步瘦身
codegen-units = 1
# 崩溃直接abort，移除panic unwind相关冗余代码
panic = "abort"
# 移除调试符号，减小target缓存体积
debug = false
# 关闭运行时边界检查，提升运行速度+缩小文件
overflow-checks = false

# 开发调试配置（本地开发用，不影响CI发布）
[profile.dev]
incremental = true
opt-level = 0
debug = true
