name: CI
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend · tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm deps
        run: npm install --no-audit --no-fund
      - name: TypeScript type-check
        run: npx tsc --noEmit
      - name: Build frontend
        run: npm run build

  rust-lint:
    name: Rust (Ubuntu) · check + clippy + fmt + release cache
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-cache-ubuntu-22.04-Linux-latest

      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo check --locked
        run: cargo check --locked
      - name: cargo clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Install npm deps
        working-directory: ${{ github.workspace }}
        run: npm install --no-audit --no-fund

      - name: Build release cache (tauri build --no-bundle)
        run: |
          npm run tauri -- build \
            --target x86_64-unknown-linux-gnu \
            --no-bundle \
            --verbose
        env:
          CARGO_INCREMENTAL: 1

  rust-windows-check:
    name: Rust (Windows) · check + release cache
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-cache-windows-latest-Windows-latest

      - name: cargo check --locked
        run: cargo check --locked --target x86_64-pc-windows-msvc

      - name: Install npm deps
        working-directory: ${{ github.workspace }}
        shell: bash
        run: npm install --no-audit --no-fund

      - name: Build release cache (tauri build --no-bundle)
        run: |
          npm run tauri -- build \
            --target x86_64-pc-windows-msvc \
            --no-bundle \
            --verbose
        env:
          CARGO_INCREMENTAL: 1

  rust-macos-check:
    name: Rust (macOS) · check + release cache
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-cache-macos-latest-macOS-latest

      - name: cargo check --locked
        run: cargo check --locked --target aarch64-apple-darwin

      - name: Install npm deps
        working-directory: ${{ github.workspace }}
        run: npm install --no-audit --no-fund

      - name: Build release cache (tauri build --no-bundle)
        run: |
          npm run tauri -- build \
            --target aarch64-apple-darwin \
            --no-bundle \
            --verbose
        env:
          CARGO_INCREMENTAL: 1