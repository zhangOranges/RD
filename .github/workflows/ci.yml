name: CI
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ------------------------------------------------------------
  # 1) TypeScript / Frontend: install deps, type-check, build frontend
  # ------------------------------------------------------------
  frontend:
    name: Frontend · tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm deps
        run: npm install --no-audit --no-fund
      - name: TypeScript type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build frontend (vite build)
        run: npm run build

  # ------------------------------------------------------------
  # 2) Rust backend: cargo check / clippy / fmt + release build (Ubuntu)
  # ------------------------------------------------------------
  rust-lint:
    name: Rust (Ubuntu) · check + clippy + fmt + release cache
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          # 固定 key，不依赖 Cargo.lock hash，版本号变化不影响依赖缓存
          key: rust-cache-ubuntu-22.04-Linux-latest

      - name: cargo fmt (check format)
        run: cargo fmt --all -- --check
      - name: cargo check --locked
        run: cargo check --locked
      - name: cargo clippy linter
        run: cargo clippy --locked --all-targets -- -D warnings

      # ------------------------------------------------------------------
      # 构建前端（Release 同样需要）
      # ------------------------------------------------------------------
      - name: Install frontend deps & build dist
        working-directory: ${{ github.workspace }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      # ------------------------------------------------------------------
      # 关键：使用与 Release 完全相同的构建命令，并带上 --locked
      # 这样 Cargo.lock 不会改变，编译产物与 Release 完全兼容
      # ------------------------------------------------------------------
      - name: cargo build --release (缓存 release 产物)
        run: |
          cargo build --release --locked --bins --target x86_64-unknown-linux-gnu --features tauri/custom-protocol

  # ------------------------------------------------------------
  # 3) Rust backend: cargo check + release build on Windows
  # ------------------------------------------------------------
  rust-windows-check:
    name: Rust (Windows) · check + release cache
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain (stable-x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-cache-windows-latest-Windows-latest

      - name: cargo check --locked --target x86_64-pc-windows-msvc
        run: cargo check --locked --target x86_64-pc-windows-msvc

      - name: Install frontend deps & build dist
        working-directory: ${{ github.workspace }}
        shell: bash
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: cargo build --release (缓存 release 产物)
        run: |
          cargo build --release --locked --bins --target x86_64-pc-windows-msvc --features tauri/custom-protocol

  # ------------------------------------------------------------
  # 4) Rust backend: cargo check + release build on macOS (Apple Silicon)
  # ------------------------------------------------------------
  rust-macos-check:
    name: Rust (macOS) · check + release cache
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain (stable-aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: rust-cache-macos-latest-macOS-latest

      - name: cargo check --locked --target aarch64-apple-darwin
        run: cargo check --locked --target aarch64-apple-darwin

      - name: Install frontend deps & build dist
        working-directory: ${{ github.workspace }}
        run: |
          npm install --no-audit --no-fund
          npm run build

      - name: cargo build --release (缓存 release 产物)
        run: |
          cargo build --release --locked --bins --target aarch64-apple-darwin --features tauri/custom-protocol