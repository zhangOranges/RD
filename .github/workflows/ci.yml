name: CI
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ------------------------------------------------------------
  # 1) TypeScript / Frontend: install deps, type-check, build frontend
  # ------------------------------------------------------------
  frontend:
    name: Frontend · tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm deps
        run: npm install --no-audit --no-fund
      - name: TypeScript type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build frontend (vite build)
        run: npm run build

  # ------------------------------------------------------------
  # 2) Rust backend: fmt + check + clippy（仅语法/lint 检查，不做 release 构建）
  # ------------------------------------------------------------
  rust-lint:
    name: Rust · fmt + check + clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: cargo fmt (check format)
        run: cargo fmt --all -- --check
      - name: cargo check
        run: cargo check --locked
      - name: cargo clippy linter
        run: cargo clippy --locked --all-targets -- -D warnings
