name: CI
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ------------------------------------------------------------
  # 1) TypeScript / Frontend: install deps, type-check, build frontend
  # ------------------------------------------------------------
  frontend:
    name: Frontend · tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm deps
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: TypeScript type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build frontend (vite build)
        run: npm run build
  # ------------------------------------------------------------
  # 2) Rust backend: cargo check / clippy / fmt (Ubuntu)
  # ------------------------------------------------------------
  rust-lint:
    name: Rust · check + clippy + fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          # 与 Release workflow 使用相同前缀，确保 CI 在 main 分支保存的缓存
          # 能被 Release 的 restore-keys 前缀命中（跨 scope 共享默认分支）
          key: rust-cache-ubuntu-latest-Linux-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-cache-ubuntu-latest-Linux-
            rust-cache-ubuntu-22.04-Linux-
            rust-cache-ubuntu-22.04-

      - name: cargo fmt (check format)
        run: cargo fmt --all -- --check
      - name: cargo check --locked
        run: cargo check --locked
      - name: cargo clippy linter
        run: cargo clippy --locked --all-targets -- -D warnings
  # ------------------------------------------------------------
  # 3) Rust backend: cargo check on Windows (native target for Tauri)
  # ------------------------------------------------------------
  rust-windows-check:
    name: Rust (Windows) · cargo check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain (stable-x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          # 与 Release workflow 使用相同前缀
          key: rust-cache-windows-latest-Windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-cache-windows-latest-Windows-
            rust-cache-windows-latest-

      - name: cargo check --target x86_64-pc-windows-msvc
        run: cargo check --locked --target x86_64-pc-windows-msvc
