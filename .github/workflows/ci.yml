name: CI
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ------------------------------------------------------------
  # 1) TypeScript / Frontend: install deps, type-check, build frontend
  # ------------------------------------------------------------
  frontend:
    name: Frontend · tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm deps
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: TypeScript type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build frontend (vite build)
        run: npm run build
  # ------------------------------------------------------------
  # 2) Rust backend: cargo check / clippy / fmt (Ubuntu)
  # ------------------------------------------------------------
  rust-lint:
    name: Rust · check + clippy + fmt
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          # 只允许精确 key 匹配，不做 restore-keys 回退
          # 原因：跨平台恢复缓存会导致 glibc 不兼容（如 ubuntu-latest → ubuntu-22.04）
          key: rust-cache-ubuntu-22.04-Linux-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: cargo fmt (check format)
        run: cargo fmt --all -- --check
      - name: cargo check --locked
        run: cargo check --locked
      - name: cargo clippy linter
        run: cargo clippy --locked --all-targets -- -D warnings
      # ------------------------------------------------------------------
      # Release 构建（用于缓存 target/release 供 Release workflow 命中）
      # CI 用 debug 模式检查，但 Release 用 release 模式构建。
      # 两者产物目录不同（target/debug vs target/release），
      # 所以 CI 必须额外构建一次 release，让缓存里有 release 产物。
      # 首次运行会慢（~8min），后续命中缓存后会快。
      # ------------------------------------------------------------------
      - name: cargo build --release (缓存 release 产物)
        run: cargo build --release --locked
  # ------------------------------------------------------------
  # 3) Rust backend: cargo check on Windows (native target for Tauri)
  # ------------------------------------------------------------
  rust-windows-check:
    name: Rust (Windows) · cargo check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain (stable-x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          # 与 Release workflow 使用相同前缀
          key: rust-cache-windows-latest-Windows-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            rust-cache-windows-latest-Windows-
            rust-cache-windows-latest-

      - name: cargo check --target x86_64-pc-windows-msvc
        run: cargo check --locked --target x86_64-pc-windows-msvc
