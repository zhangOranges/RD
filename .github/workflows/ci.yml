name: CI
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ------------------------------------------------------------
  # 1) TypeScript / Frontend: install deps, type-check, build frontend
  # ------------------------------------------------------------
  frontend:
    name: Frontend · tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm deps
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: TypeScript type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build frontend (vite build)
        run: npm run build
  # ------------------------------------------------------------
  # 2) Rust backend: cargo check / clippy / fmt (Ubuntu)
  # ------------------------------------------------------------
  rust-lint:
    name: Rust · check + clippy + fmt
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          # 只允许精确 key 匹配，不做 restore-keys 回退
          # 原因：跨平台恢复缓存会导致 glibc 不兼容（如 ubuntu-latest → ubuntu-22.04）
          key: rust-cache-ubuntu-22.04-Linux-${{ hashFiles('src-tauri/Cargo.lock') }}

      # ------------------------------------------------------------------
      # 关键：保存并恢复 Cargo.lock 原始状态
      # 原因：cargo check / build 可能自动更新 Cargo.lock（即使 --locked），
      # 导致 Post Cache 保存的缓存对应的 Cargo.lock hash 与 Release 查找时的
      # 原始 Cargo.lock hash 不一致，从而无法命中。
      # ------------------------------------------------------------------
      - name: Save original Cargo.lock
        run: cp Cargo.lock Cargo.lock.orig

      - name: cargo fmt (check format)
        run: cargo fmt --all -- --check
      - name: cargo check --locked
        run: cargo check --locked
      - name: cargo clippy linter
        run: cargo clippy --locked --all-targets -- -D warnings
      # ------------------------------------------------------------------
      # Release 构建（用于缓存 target/release 供 Release workflow 命中）
      # CI 用 debug 模式检查，但 Release 用 release 模式构建。
      # 两者产物目录不同（target/debug vs target/release），
      # 所以 CI 必须额外构建一次 release，让缓存里有 release 产物。
      # 首次运行会慢（~8min），后续命中缓存后会快。
      # ------------------------------------------------------------------
      - name: cargo build --release (缓存 release 产物)
        run: cargo build --release --locked

      # 关键：恢复 Cargo.lock 原始状态
      # cargo 操作可能修改 Cargo.lock，导致 Post Cache 保存时的 hash 与
      # Release 查找时的 hash 不一致。这里在 Post Cache 之前恢复。
      - name: Restore original Cargo.lock
        run: cp Cargo.lock.orig Cargo.lock
  # ------------------------------------------------------------
  # 3) Rust backend: cargo check + release build on Windows
  # ------------------------------------------------------------
  rust-windows-check:
    name: Rust (Windows) · check + release
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain (stable-x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          # 只允许精确 key 匹配，与 Release workflow 一致
          key: rust-cache-windows-latest-Windows-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Save original Cargo.lock
        shell: bash
        run: cp Cargo.lock Cargo.lock.orig

      - name: cargo check --target x86_64-pc-windows-msvc
        run: cargo check --locked --target x86_64-pc-windows-msvc

      - name: cargo build --release (缓存 release 产物)
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Restore original Cargo.lock
        shell: bash
        run: cp Cargo.lock.orig Cargo.lock

  # ------------------------------------------------------------
  # 4) Rust backend: cargo check + release build on macOS (Apple Silicon)
  # ------------------------------------------------------------
  rust-macos-check:
    name: Rust (macOS) · check + release
    runs-on: macos-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain (stable-aarch64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          # 只允许精确 key 匹配，与 Release workflow 一致
          key: rust-cache-macos-latest-macOS-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Save original Cargo.lock
        run: cp Cargo.lock Cargo.lock.orig

      - name: cargo check --target aarch64-apple-darwin
        run: cargo check --locked --target aarch64-apple-darwin

      - name: cargo build --release (缓存 release 产物)
        run: cargo build --release --locked --target aarch64-apple-darwin

      - name: Restore original Cargo.lock
        run: cp Cargo.lock.orig Cargo.lock
