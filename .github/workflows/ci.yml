name: CI
on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [main, master]
    paths-ignore:
      - '**.md'
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # ------------------------------------------------------------
  # 1) TypeScript / Frontend: install deps, type-check, build frontend
  # ------------------------------------------------------------
  frontend:
    name: Frontend · tsc + vite build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install npm deps
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: TypeScript type-check (tsc --noEmit)
        run: npx tsc --noEmit
      - name: Build frontend (vite build)
        run: npm run build
  # ------------------------------------------------------------
  # 2) Rust backend: cargo check / clippy / fmt (Ubuntu)
  # ------------------------------------------------------------
  rust-lint:
    name: Rust · check + clippy + fmt
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # 与 Release workflow 共用第三方依赖缓存 shared-key，减少 10 GB 配额占用
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          cache-all-crates: true
          cache-targets: true
          shared-key: rust-x86_64-unknown-linux-gnu

      - name: cargo fmt (check format)
        run: cargo fmt --all -- --check
      - name: cargo check --locked
        run: cargo check --locked
      - name: cargo clippy linter
        run: cargo clippy --locked --all-targets -- -D warnings
  # ------------------------------------------------------------
  # 3) Rust backend: cargo check on Windows (native target for Tauri)
  # ------------------------------------------------------------
  rust-windows-check:
    name: Rust (Windows) · cargo check
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Setup Rust toolchain (stable-x86_64-pc-windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 与 Release workflow 共用第三方依赖缓存 shared-key
      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          cache-all-crates: true
          cache-targets: true
          shared-key: rust-x86_64-pc-windows-msvc

      - name: cargo check --target x86_64-pc-windows-msvc
        run: cargo check --locked --target x86_64-pc-windows-msvc
