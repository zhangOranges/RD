name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # 三平台构建：Windows / Linux / macOS (Apple Silicon)
  # 每个 job 只上传 artifact，不直接操作 GitHub Release
  # ------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            artifact-dir: artifacts-windows
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            artifact-dir: artifacts-linux
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            artifact-dir: artifacts-macos

    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Tauri build
        run: npm run tauri -- build --target ${{ matrix.target }} --verbose
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      # ------------------------------------------------------------
      # 收集产物（各平台分别处理）
      # ------------------------------------------------------------
      - name: Collect artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $out = "${{ matrix.artifact-dir }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # 列出 bundle 目录
          Write-Host "=== Bundle dir contents ==="
          Get-ChildItem $bundle -Recurse -Depth 2 2>$null | ForEach-Object { Write-Host $_.FullName }
          # 收集所有产物
          Get-ChildItem -Path $bundle -Recurse -File -Include *.msi,*.exe | ForEach-Object {
            Write-Host "Copying $($_.Name)"
            Copy-Item $_.FullName -Destination $out
          }
          Write-Host "=== Final Artifacts ==="
          Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Collect artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          out="${{ matrix.artifact-dir }}"
          mkdir -p "$out"
          # 列出 bundle 目录以便调试
          echo "=== Bundle dir ==="
          find "$bundle" -maxdepth 3 -type f 2>/dev/null || echo "No bundle dir"
          # 收集所有包
          find "$bundle" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' \) -exec cp {} "$out/" 2>/dev/null || true
          echo "=== Artifacts ==="
          ls -lh "$out"

      - name: Collect artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          out="${{ matrix.artifact-dir }}"
          mkdir -p "$out"
          # 列出 bundle 目录以便调试
          echo "=== Bundle dir ==="
          find "$bundle" -maxdepth 3 -type f 2>/dev/null || echo "No bundle dir"
          # 收集 dmg
          find "$bundle" -type f -name '*.dmg' -exec cp {} "$out/" 2>/dev/null || true
          # 收集 .app 或 .app.tar.gz
          if find "$bundle" -type d -name '*.app' -maxdepth 4 | head -1 | grep -q .; then
            APP_PATH=$(find "$bundle" -type d -name '*.app' -maxdepth 4 | head -1)
            echo "Found app: $APP_PATH"
            tar -czf "$out/RD-macos.tar.gz" -C "$(dirname "$APP_PATH")" "$(basename "$APP_PATH")"
          fi
          echo "=== Artifacts ==="
          ls -lh "$out"

      # ------------------------------------------------------------
      # 仅上传 artifact（不再直接操作 GitHub Release）
      # ------------------------------------------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: rd-app-${{ matrix.label }}
          path: ${{ matrix.artifact-dir }}/*
          retention-days: 30

  # ------------------------------------------------------------
  # 汇总发布：下载所有 artifact，一次性创建 GitHub Release
  # ------------------------------------------------------------
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: rd-app-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -lh all-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: all-artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
