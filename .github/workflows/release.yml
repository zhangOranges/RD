name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # ------------------------------------------------------------
  # 三平台构建：Windows / Linux / macOS (Apple Silicon)
  # 每个 job：
  #   1) Tauri build（自动生成 .sig 签名文件）
  #   2) 上传产物 artifact（附带 .sig 文件）
  #   3) 输出本平台 platform-manifest.json（给汇总 job 生成 latest.json 用）
  # ------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            updater-key: windows-x86_64
            updater-format: nsis
            artifact-dir: artifacts-windows
            bundles: nsis,msi
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            updater-key: linux-x86_64
            updater-format: appimage
            artifact-dir: artifacts-linux
            bundles: deb,appimage
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            updater-key: darwin-aarch64
            updater-format: app
            artifact-dir: artifacts-macos
            bundles: dmg,app
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    outputs:
      manifest: ${{ steps.write-manifest.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4

      # ========== 1. Node 缓存强化，锁定 package-lock 哈希 ==========
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm deps
        run: npm ci --prefer-offline --no-audit --no-fund

      # ========== 2. Rust 工具链 ==========
      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ========== 3. 系统依赖（Linux 专用） ==========
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            fakeroot \
            dpkg \
            file

      # ========== 4. 先 Rust 增量缓存 RESTORE，再安装 tauri-cli ==========
      # 顺序很重要：Swatinem/rust-cache 在这一步 restore target + CARGO_BIN_DIR，
      # 这样下一步 Install cargo-tauri 就能检测到缓存里的 cargo-tauri 而跳过安装。
      - name: Resolve cargo bin dir
        shell: bash
        run: |
          HOME_ABS="$(cd "$HOME" && pwd)"
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            WIN_HOME=$(cygpath -w "$HOME_ABS" 2>/dev/null || echo "$USERPROFILE")
            WIN_HOME_FWD="${WIN_HOME//\\//}"
            CARGO_BIN_DIR="${WIN_HOME_FWD}/.cargo/bin"
          else
            CARGO_BIN_DIR="${HOME_ABS}/.cargo/bin"
          fi
          mkdir -p "$CARGO_BIN_DIR"
          echo "CARGO_BIN_DIR=${CARGO_BIN_DIR}" >> "$GITHUB_ENV"
          echo "Resolved CARGO_BIN_DIR: ${CARGO_BIN_DIR}"

      # ========== 5. rust-cache 智能增量缓存（RESTORE 必须在 Install cargo-tauri 之前） ==========
      # cache-all-crates: true 缓存所有第三方依赖编译产物（占编译时间 90%+）
      # cache-targets: true 缓存 target 下所有 target 的编译产物
      # 注：不要传 cache-directories 给绝对路径，会干扰 rust-cache 的缓存 key 哈希算法
      #   rust-cache 默认已包含 $CARGO_HOME/{bin,registry}，足够用。
      # 注：不要使用 shared-key，它会改变 cache key 结构导致 restore 不匹配
      - name: Rust incremental compile cache
        id: rust-cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'
          cache-all-crates: true
          cache-targets: true

      - name: Print cache hit status & restored contents
        shell: bash
        run: |
          echo "Rust cache-hit (primary key exact): ${{ steps.rust-cache.outputs.cache-hit }}"
          echo "Primary cache key:        ${{ steps.rust-cache.outputs.cache-primary-key }}"
          echo ""
          echo "=== CARGO_BIN_DIR 已恢复的内容（关键：cargo-tauri 是否存在） ==="
          ls -la "${CARGO_BIN_DIR}" 2>/dev/null | head -20 || echo "(空目录，首次构建)"
          echo ""
          # 注意：cache-hit=false ≠ 没恢复！Swatinem/rust-cache 命中 restore-key 时也会恢复 target
          # 只看 cache-hit 不可靠，直接检查 target 目录的大小和内容
          TARGET_DIR="src-tauri/target"
          if [ -d "$TARGET_DIR" ]; then
            echo "=== target 目录已恢复（来自 restore-key 命中） ==="
            du -sh "$TARGET_DIR" 2>/dev/null || true
            # 数一下已编译的 .rlib 数量（第三方依赖的编译产物）
            RLIB_COUNT=$(find "$TARGET_DIR" -name "*.rlib" 2>/dev/null | wc -l)
            echo "已缓存的 .rlib 文件数: $RLIB_COUNT"
          else
            echo "=== target 目录不存在（首次构建，无缓存） ==="
          fi

      # ========== 6. 安装 tauri-cli（仅在缓存里没有时才执行） ==========
      # 安装完成后，cargo-bin 目录会通过 rust-cache 的 cache-directories 参数
      # 在 job 结束时（post 阶段）和 Rust 增量缓存一起保存。
      - name: Install cargo-tauri if not cached
        shell: bash
        run: |
          export PATH="${CARGO_BIN_DIR}:$PATH"
          TAURI_BIN="${CARGO_BIN_DIR}/cargo-tauri"
          if [[ "${{ matrix.platform }}" == "windows-latest" ]]; then
            TAURI_BIN="${CARGO_BIN_DIR}/cargo-tauri.exe"
          fi

          if [ -f "$TAURI_BIN" ]; then
            echo "✅ cargo-tauri 已存在于缓存中，跳过安装"
            "$TAURI_BIN" --version 2>/dev/null || true
            exit 0
          fi

          echo "=== cargo-tauri 不存在，开始安装（首次构建或缓存失效） ==="
          set +e

          # 先尝试 cargo-binstall（自带预编译包，10 秒）
          if ! command -v cargo-binstall >/dev/null 2>&1; then
            BINSTALL_VERSION="1.10.20"
            case "${{ matrix.platform }}" in
              ubuntu-22.04)
                BINSTALL_URL="https://github.com/cargo-bins/cargo-binstall/releases/download/v${BINSTALL_VERSION}/cargo-binstall-x86_64-unknown-linux-gnu.tgz"
                ;;
              macos-14)
                BINSTALL_URL="https://github.com/cargo-bins/cargo-binstall/releases/download/v${BINSTALL_VERSION}/cargo-binstall-aarch64-apple-darwin.tgz"
                ;;
              windows-latest)
                BINSTALL_URL="https://github.com/cargo-bins/cargo-binstall/releases/download/v${BINSTALL_VERSION}/cargo-binstall-x86_64-pc-windows-msvc.zip"
                ;;
              *)
                BINSTALL_URL=""
                ;;
            esac
            if [ -n "$BINSTALL_URL" ]; then
              echo "下载 cargo-binstall: $BINSTALL_URL"
              curl -fsSL --retry 3 --connect-timeout 15 -o "/tmp/binstall-archive" "$BINSTALL_URL" || \
              wget -q --tries=3 --timeout=15 -O "/tmp/binstall-archive" "$BINSTALL_URL" || true
              if [ -f "/tmp/binstall-archive" ]; then
                case "$BINSTALL_URL" in
                  *.tgz|*.tar.gz)
                    tar -xzf "/tmp/binstall-archive" -C "$CARGO_BIN_DIR" --strip-components=1 2>/dev/null || \
                    tar -xzf "/tmp/binstall-archive" -C "$CARGO_BIN_DIR"
                    ;;
                  *.zip)
                    if command -v unzip >/dev/null 2>&1; then
                      unzip -j -o "/tmp/binstall-archive" -d "$CARGO_BIN_DIR" 2>/dev/null || \
                      unzip -o "/tmp/binstall-archive" -d "$CARGO_BIN_DIR"
                    else
                      powershell -NoProfile -Command "Expand-Archive -Force -Path '/tmp/binstall-archive' -DestinationPath '$CARGO_BIN_DIR'"
                    fi
                    ;;
                esac
                chmod +x "$CARGO_BIN_DIR"/cargo-binstall "$CARGO_BIN_DIR"/cargo-binstall.exe 2>/dev/null || true
                rm -f "/tmp/binstall-archive"
                echo "cargo-binstall 安装完成"
              fi
            fi
          fi

          if command -v cargo-binstall >/dev/null 2>&1; then
            echo "cargo-binstall: $(cargo-binstall --version 2>&1)"
            echo "尝试 cargo-binstall 安装 tauri-cli ..."
            if cargo binstall --no-confirm --strategies auto "tauri-cli@^2"; then
              echo "✅ tauri-cli 安装完成"
            else
              echo "cargo-binstall 安装失败，fallback to cargo install"
              cargo install tauri-cli --version "^2"
            fi
          else
            echo "cargo-binstall 不可用，使用 cargo install"
            cargo install tauri-cli --version "^2"
          fi

          echo "验证安装结果:"
          ls -la "$CARGO_BIN_DIR" 2>/dev/null | head -20 || true
          if [ -f "$TAURI_BIN" ]; then
            echo "✅ cargo-tauri 安装成功: $TAURI_BIN"
            "$TAURI_BIN" --version 2>/dev/null || true
          else
            echo "❌ cargo-tauri 未找到，可能安装失败"
            exit 1
          fi

      # ========== 7. Windows 缓存 Wix 打包工具（解决每次下载Wix） ==========
      - name: Cache Tauri Wix tools (Windows only)
        if: matrix.platform == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: src-tauri/.tauri-cache
          key: ${{ matrix.platform }}-tauri-wix-v1
      - name: Set Tauri cache dir env
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: echo "TAURI_CACHE_DIR=src-tauri/.tauri-cache" >> $GITHUB_ENV

      # ========== 原有签名校验步骤不变 ==========
      - name: Verify signing key secret (debug)
        shell: bash
        run: |
          KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is EMPTY. Please configure it in GitHub Secrets."
            exit 1
          fi
          echo "Key length: ${#KEY} chars"
          echo "Key is set: $([[ -n "$KEY" ]] && echo yes || echo no)"

      # ========== Tauri 构建（开启增量编译） ==========
      # CARGO_INCREMENTAL=1 让 release 模式也启用增量编译
      # 第二次构建时未变更的 crate 直接复用缓存，仅重编译改动部分
      - name: Tauri build
        run: npm run tauri -- build --target ${{ matrix.target }} -b ${{ matrix.bundles }} --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          CARGO_INCREMENTAL: 1

      # ========== 诊断产物目录（仅在构建失败时执行，减少日志噪音） ==========
      - name: Diagnose bundle output (on failure)
        if: failure()
        shell: bash
        run: |
          set +o pipefail
          echo "=== Environment ==="
          echo "matrix.target=${{ matrix.target }}"
          echo "matrix.bundles=${{ matrix.bundles }}"
          echo "matrix.platform=${{ matrix.platform }}"
          echo ""
          echo "=== All bundle dirs ==="
          find src-tauri/target -name "bundle" -type d 2>/dev/null | head -20 || echo "(none)"
          echo ""
          echo "--- target/release contents ---"
          ls src-tauri/target/release/ 2>/dev/null | head -20 || echo "(not found)"
          echo ""
          TRIPLE_DIR="src-tauri/target/${{ matrix.target }}/release"
          echo "--- $TRIPLE_DIR contents ---"
          ls "$TRIPLE_DIR" 2>/dev/null | head -20 || echo "(not found)"
          echo ""
          for bundle in "src-tauri/target/release/bundle" "src-tauri/target/${{ matrix.target }}/release/bundle"; do
            if [ -d "$bundle" ]; then
              echo "=== BUNDLE DIR: $bundle ==="
              ls "$bundle" 2>/dev/null
              find "$bundle" -maxdepth 2 -type f 2>/dev/null | grep -E '\.(deb|AppImage|dmg|tar\.gz|sig|exe|msi)$' || echo "  (no installer files at depth<=2)"
              echo "--- END ---"
            fi
          done
          echo ""
          echo "=== Installer files anywhere ==="
          find src-tauri/target -maxdepth 5 -type f 2>/dev/null | grep -E '\.(deb|AppImage|dmg|tar\.gz|sig|exe|msi)$' | head -30 || echo "(none found)"
          echo ""
          echo "=== Diagnostic complete ==="
          true

      # ========== 收集产物（Windows） ==========
      - name: Collect artifacts (Windows)
        id: collect-windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $out = "${{ matrix.artifact-dir }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $bundlePaths = @(
            "src-tauri/target/release/bundle",
            "src-tauri/target/${{ matrix.target }}/release/bundle"
          )
          foreach ($bundle in $bundlePaths) {
            if (Test-Path $bundle) {
              Write-Host "=== Found bundle dir: $bundle ==="
              Get-ChildItem $bundle -Recurse -Depth 3 2>$null | ForEach-Object { Write-Host $_.FullName }
              Get-ChildItem -Path $bundle -Recurse -File -Include *.msi,*.exe,*.sig | ForEach-Object {
                Write-Host "Copying $($_.Name)"
                Copy-Item $_.FullName -Destination $out
              }
            }
          }
          $portablePaths = @(
            "src-tauri/target/release/rd_app.exe",
            "src-tauri/target/${{ matrix.target }}/release/rd_app.exe"
          )
          foreach ($p in $portablePaths) {
            if (Test-Path $p) {
              Copy-Item $p -Destination $out
              break
            }
          }
          $updaterFile = Get-ChildItem $out -Filter "*.exe" | Where-Object { $_.Name -notlike "*portable*" } | Select-Object -First 1
          if (-not $updaterFile) { $updaterFile = Get-ChildItem $out -Filter "*.msi" | Select-Object -First 1 }
          if ($updaterFile) {
            echo "UPDATER_FILE=$($updaterFile.Name)" >> $env:GITHUB_OUTPUT
            echo "UPDATER_FORMAT=nsis" >> $env:GITHUB_OUTPUT
          }
          Write-Host "=== Artifacts ==="
          Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)" }

      # ========== 收集产物（Linux） ==========
      - name: Collect artifacts (Linux)
        id: collect-linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          out="${{ matrix.artifact-dir }}"
          mkdir -p "$out"
          BUNDLE1="src-tauri/target/${{ matrix.target }}/release/bundle"
          BUNDLE2="src-tauri/target/release/bundle"
          bundle=""
          if [ -d "$BUNDLE1" ]; then bundle="$BUNDLE1"; elif [ -d "$BUNDLE2" ]; then bundle="$BUNDLE2"; fi
          if [ -n "$bundle" ]; then
            echo "=== Bundle dir: $bundle ==="
            find "$bundle" -type f
            echo ""
            echo "=== Copying installers and sig files ==="
            while IFS= read -r -d '' file; do
              fname=$(basename "$file")
              if [ "$fname" = "control.tar.gz" ] || [ "$fname" = "data.tar.gz" ]; then
                echo "  Skipping (internal deb file): $fname"
                continue
              fi
              echo "  Copying $fname"
              cp "$file" "$out/"
            done < <(find "$bundle" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.sig' \) -print0)
          else
            echo "ERROR: No bundle directory found!"
            find src-tauri/target -maxdepth 4 -name "bundle" -type d 2>/dev/null
          fi
          echo "=== Artifacts ==="
          ls -lh "$out"
          UPDATER_FILE=$(ls "$out"/*.AppImage 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
          UPDATER_FORMAT="appimage"
          if [ -z "$UPDATER_FILE" ]; then
            UPDATER_FILE=$(ls "$out"/*.deb 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
            UPDATER_FORMAT="deb"
          fi
          echo "UPDATER_FILE=$UPDATER_FILE" >> "$GITHUB_OUTPUT"
          echo "UPDATER_FORMAT=$UPDATER_FORMAT" >> "$GITHUB_OUTPUT"

      # ========== 收集产物（macOS） ==========
      - name: Collect artifacts (macOS)
        id: collect-macos
        if: matrix.platform == 'macos-latest'
        run: |
          out="${{ matrix.artifact-dir }}"
          mkdir -p "$out"
          for bundle in "src-tauri/target/release/bundle" "src-tauri/target/${{ matrix.target }}/release/bundle"; do
            if [ -d "$bundle" ]; then
              echo "=== Found bundle dir: $bundle ==="
              find "$bundle" -type f
              echo ""
              echo "=== Copying dmg / tar.gz / sig files ==="
              while IFS= read -r -d '' file; do
                fname=$(basename "$file")
                echo "  Copying $fname"
                cp "$file" "$out/"
              done < <(find "$bundle" -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -print0)
            fi
          done
          echo "=== Artifacts ==="
          ls -lh "$out"
          UPDATER_FILE=$(ls "$out"/*.dmg 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
          UPDATER_FORMAT="dmg"
          if [ -z "$UPDATER_FILE" ]; then
            UPDATER_FILE=$(ls "$out"/*.tar.gz 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
            UPDATER_FORMAT="app"
          fi
          echo "UPDATER_FILE=$UPDATER_FILE" >> "$GITHUB_OUTPUT"
          echo "UPDATER_FORMAT=$UPDATER_FORMAT" >> "$GITHUB_OUTPUT"

      # ========== 生成平台更新清单 ==========
      - name: Write platform manifest
        id: write-manifest
        shell: bash
        run: |
          OUTDIR="${{ matrix.artifact-dir }}"
          UPDATER_FILE="${{ steps.collect-windows.outputs.UPDATER_FILE }}${{ steps.collect-linux.outputs.UPDATER_FILE }}${{ steps.collect-macos.outputs.UPDATER_FILE }}"
          UPDATER_FORMAT="${{ steps.collect-windows.outputs.UPDATER_FORMAT }}${{ steps.collect-linux.outputs.UPDATER_FORMAT }}${{ steps.collect-macos.outputs.UPDATER_FORMAT }}"
          KEY="${{ matrix.updater-key }}"
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          SIG_CONTENT=""
          if [ -n "$UPDATER_FILE" ] && [ -f "$OUTDIR/${UPDATER_FILE}.sig" ]; then
            SIG_CONTENT=$(cat "$OUTDIR/${UPDATER_FILE}.sig")
          fi
          SIZE="0"
          if [ -n "$UPDATER_FILE" ] && [ -f "$OUTDIR/${UPDATER_FILE}" ]; then
            SIZE=$(wc -c < "$OUTDIR/${UPDATER_FILE}" | tr -d ' ')
            if [ -z "$SIZE" ] || [ "$SIZE" = "0" ]; then
              SIZE=$(ls -l "$OUTDIR/${UPDATER_FILE}" | awk '{print $5}')
            fi
          fi
          mkdir -p manifests
          MANIFEST_FILE="manifests/${{ matrix.label }}.json"
          cat > "$MANIFEST_FILE" <<JSONEOF
          {
            "key": "${KEY}",
            "url_filename": "${UPDATER_FILE}",
            "url": "https://github.com/${REPO}/releases/download/${TAG}/${UPDATER_FILE}",
            "signature": "$(echo -n "$SIG_CONTENT" | sed ':a;N;$!ba;s/\n/\\n/g')",
            "format": "${UPDATER_FORMAT}",
            "size": ${SIZE:-0}
          }
          JSONEOF
          cat "$MANIFEST_FILE"
          echo "manifest=$(cat "$MANIFEST_FILE" | tr -d '\n' | sed 's/"/\\"/g')" >> "$GITHUB_OUTPUT"

      # 上传产物
      - uses: actions/upload-artifact@v4
        with:
          name: rd-app-${{ matrix.label }}
          path: |
            ${{ matrix.artifact-dir }}/*
            manifests/*.json
          retention-days: 30

  # ------------------------------------------------------------
  # 汇总发布 Job
  # ------------------------------------------------------------
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: rd-app-*
          merge-multiple: true
      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -lh all-artifacts/
          echo "=== manifests dir ==="
          ls -lh all-artifacts/manifests/ 2>/dev/null || echo "(no manifests)"
          cat all-artifacts/manifests/*.json 2>/dev/null || true
          echo "=== Full tree ==="
          find all-artifacts -type f 2>/dev/null | head -50
      - name: Flatten all artifacts to root
        run: |
          cd all-artifacts
          echo "=== Before flatten ==="
          find . -type f | head -30
          while IFS= read -r -d '' file; do
            fname=$(basename "$file")
            cp "$file" "./$fname"
          done < <(find . -mindepth 2 -type f -not -path './manifests/*' -print0)
          find . -mindepth 1 -maxdepth 1 -type d -not -name 'manifests' -exec rm -rf {} + 2>/dev/null || true
          echo "=== After flatten ==="
          ls -lh .
      - name: Generate latest.json updater manifest
        run: |
          cd all-artifacts
          export TAG="${GITHUB_REF_NAME}"
          export VERSION="${TAG#v}"
          export PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export CHANGELOG_PATH="${GITHUB_WORKSPACE}/CHANGELOG.md"
          echo "Looking for CHANGELOG.md at: $CHANGELOG_PATH"
          ls -la "$CHANGELOG_PATH" 2>/dev/null || echo "(no CHANGELOG.md found)"
          node <<'NODEEOF' > latest.json
          const fs = require('fs');
          const path = require('path');
          const tag = process.env.TAG;
          const version = process.env.VERSION;
          const pubDate = process.env.PUB_DATE;
          const repo = process.env.GITHUB_REPOSITORY;
          const changelogPath = process.env.CHANGELOG_PATH;
          function extractChangelog(filePath, targetVersion) {
            if (!filePath || !fs.existsSync(filePath)) {
              console.error('CHANGELOG.md not found at:', filePath);
              return null;
            }
            try {
              const content = fs.readFileSync(filePath, 'utf8');
              const lines = content.replace(/\r\n/g, '\n').split('\n');
              const versionRe = /\[?v?(\d+\.\d+\.\d+)\]?/;
              let startIdx = -1;
              for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                const m = line.match(/^##\s+(.+?)\s*$/);
                if (!m) continue;
                const heading = m[1].trim();
                const vm = heading.match(versionRe);
                if (vm && vm[1] === targetVersion) {
                  startIdx = i + 1;
                  console.error(`[CHANGELOG] Matched heading: "${heading}" at line ${i + 1}`);
                  break;
                }
              }
              if (startIdx < 0) {
                console.error(`Version ${targetVersion} not found in CHANGELOG.md`);
                const h2s = lines.filter(l => /^##\s+/.test(l.trim()));
                console.error('Available H2 headings:', JSON.stringify(h2s));
                return null;
              }
              let endIdx = lines.length;
              for (let i = startIdx; i < lines.length; i++) {
                const line = lines[i].trim();
                if (/^##\s+/.test(line)) {
                  endIdx = i;
                  break;
                }
              }
              const section = lines.slice(startIdx, endIdx).join('\n').trim();
              return section.length > 0 ? section : null;
            } catch (e) {
              console.error('Error parsing CHANGELOG:', e.message);
              return null;
            }
          }
          const manifestsDir = 'manifests';
          const platforms = {};
          if (fs.existsSync(manifestsDir)) {
            for (const f of fs.readdirSync(manifestsDir)) {
              if (!f.endsWith('.json')) continue;
              const m = JSON.parse(fs.readFileSync(path.join(manifestsDir, f), 'utf8'));
              // signature 可选：客户端手动实现更新逻辑，不依赖 Tauri updater 签名校验
              // 只要 key 和 url_filename 存在即可
              if (!m.key || !m.url_filename) {
                console.error(`Skipping incomplete manifest: ${f}`, m);
                continue;
              }
              if (!m.signature) {
                console.error(`Warning: manifest ${f} has empty signature, including anyway`);
              }
              const entry = {
                url: m.url,
              };
              if (m.signature) entry.signature = m.signature;
              if (m.format) entry.format = m.format;
              if (typeof m.size === 'number' && m.size > 0) {
                entry.size = m.size;
              }
              platforms[m.key] = entry;
            }
          }
          let notes = extractChangelog(changelogPath, version);
          if (!notes) {
            notes = `## 版本 ${version}\n\n- 更新至最新版 RD 应用。\n- 详细更新记录请前往 GitHub Release 页面查看。`;
          }
          const manifest = {
            version,
            notes,
            pub_date: pubDate,
            platforms,
          };
          process.stdout.write(JSON.stringify(manifest, null, 2));
          NODEEOF
          echo "=== latest.json ==="
          cat latest.json
          node -e '
            const j = JSON.parse(require("fs").readFileSync("latest.json","utf8"));
            require("fs").writeFileSync("release_body.md", j.notes || "", "utf8");
          ' || true
          echo "=== release_body.md (first 20 lines) ==="
          head -20 release_body.md 2>/dev/null || true
      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: all-artifacts/release_body.md
          files: |
            all-artifacts/*.exe
            all-artifacts/*.msi
            all-artifacts/*.deb
            all-artifacts/*.AppImage
            all-artifacts/*.dmg
            all-artifacts/*.tar.gz
            all-artifacts/*.sig
            all-artifacts/latest.json
            all-artifacts/*/*.exe
            all-artifacts/*/*.msi
            all-artifacts/*/*.deb
            all-artifacts/*/*.AppImage
            all-artifacts/*/*.dmg
            all-artifacts/*/*.tar.gz
            all-artifacts/*/*.sig
            all-artifacts/*/latest.json
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
