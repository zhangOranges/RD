name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # 三平台构建：Windows / Linux / macOS (Apple Silicon)
  # 每个 job：
  #   1) Tauri build（自动生成 .sig 签名文件）
  #   2) 上传产物 artifact（附带 .sig 文件）
  #   3) 输出本平台 platform-manifest.json（给汇总 job 生成 latest.json 用）
  # ------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            updater-key: windows-x86_64
            updater-format: nsis
            artifact-dir: artifacts-windows
            bundles: nsis,msi
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            updater-key: linux-x86_64
            updater-format: appimage
            artifact-dir: artifacts-linux
            bundles: deb,appimage
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            updater-key: darwin-aarch64
            updater-format: app
            artifact-dir: artifacts-macos
            bundles: dmg,app

    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    outputs:
      manifest: ${{ steps.write-manifest.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            fakeroot \
            dpkg \
            file

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Verify signing key secret (debug)
        shell: bash
        run: |
          KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is EMPTY. Please configure it in GitHub Secrets."
            exit 1
          fi
          echo "Key length: ${#KEY} chars"
          echo "Key prefix (first 40 chars): ${KEY:0:40}..."

      - name: Tauri build
        run: npm run tauri -- build --target ${{ matrix.target }} -b ${{ matrix.bundles }} --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Diagnose bundle output (all platforms)
        shell: bash
        run: |
          set +o pipefail
          echo "=== Environment ==="
          echo "matrix.target=${{ matrix.target }}"
          echo "matrix.bundles=${{ matrix.bundles }}"
          echo "matrix.platform=${{ matrix.platform }}"
          echo ""
          echo "=== All bundle dirs ==="
          find src-tauri/target -name "bundle" -type d 2>/dev/null | head -20 || echo "(none)"
          echo ""
          echo "--- target/release contents ---"
          ls src-tauri/target/release/ 2>/dev/null | head -20 || echo "(not found)"
          echo ""
          TRIPLE_DIR="src-tauri/target/${{ matrix.target }}/release"
          echo "--- $TRIPLE_DIR contents ---"
          ls "$TRIPLE_DIR" 2>/dev/null | head -20 || echo "(not found)"
          echo ""
          for bundle in "src-tauri/target/release/bundle" "src-tauri/target/${{ matrix.target }}/release/bundle"; do
            if [ -d "$bundle" ]; then
              echo "=== BUNDLE DIR: $bundle ==="
              ls "$bundle" 2>/dev/null
              find "$bundle" -maxdepth 2 -type f 2>/dev/null | grep -E '\.(deb|AppImage|dmg|tar\.gz|sig|exe|msi)$' || echo "  (no installer files at depth<=2)"
              echo "--- END ---"
            fi
          done
          echo ""
          echo "=== Installer files anywhere ==="
          find src-tauri/target -maxdepth 5 -type f 2>/dev/null | grep -E '\.(deb|AppImage|dmg|tar\.gz|sig|exe|msi)$' | head -30 || echo "(none found)"
          echo ""
          echo "=== Diagnostic complete ==="
          true

      # ------------------------------------------------------------
      # 收集产物（各平台分别处理）
      # 同时将 .sig 文件一起收集进来（后续 latest.json 会用到签名内容）
      # ------------------------------------------------------------
      - name: Collect artifacts (Windows)
        id: collect-windows
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $out = "${{ matrix.artifact-dir }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          # 两个路径都检查（原生构建 vs --target 指定构建）
          $bundlePaths = @(
            "src-tauri/target/release/bundle",
            "src-tauri/target/${{ matrix.target }}/release/bundle"
          )
          foreach ($bundle in $bundlePaths) {
            if (Test-Path $bundle) {
              Write-Host "=== Found bundle dir: $bundle ==="
              Get-ChildItem $bundle -Recurse -Depth 3 2>$null | ForEach-Object { Write-Host $_.FullName }
              Get-ChildItem -Path $bundle -Recurse -File -Include *.msi,*.exe,*.sig | ForEach-Object {
                Write-Host "Copying $($_.Name)"
                Copy-Item $_.FullName -Destination $out
              }
            }
          }
          # portable exe
          $portablePaths = @(
            "src-tauri/target/release/rd_app.exe",
            "src-tauri/target/${{ matrix.target }}/release/rd_app.exe"
          )
          foreach ($p in $portablePaths) {
            if (Test-Path $p) {
              Copy-Item $p -Destination $out
              break
            }
          }
          # 选定 updater 主包（优先 nsis exe，其次 msi）
          $updaterFile = Get-ChildItem $out -Filter "*.exe" | Where-Object { $_.Name -notlike "*portable*" } | Select-Object -First 1
          if (-not $updaterFile) { $updaterFile = Get-ChildItem $out -Filter "*.msi" | Select-Object -First 1 }
          if ($updaterFile) {
            echo "UPDATER_FILE=$($updaterFile.Name)" >> $env:GITHUB_OUTPUT
            echo "UPDATER_FORMAT=nsis" >> $env:GITHUB_OUTPUT
          }
          Write-Host "=== Artifacts ==="
          Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Collect artifacts (Linux)
        id: collect-linux
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          out="${{ matrix.artifact-dir }}"
          mkdir -p "$out"
          BUNDLE1="src-tauri/target/${{ matrix.target }}/release/bundle"
          BUNDLE2="src-tauri/target/release/bundle"

          bundle=""
          if [ -d "$BUNDLE1" ]; then bundle="$BUNDLE1"; elif [ -d "$BUNDLE2" ]; then bundle="$BUNDLE2"; fi

          if [ -n "$bundle" ]; then
            echo "=== Bundle dir: $bundle ==="
            find "$bundle" -type f
            echo ""
            echo "=== Copying installers and sig files ==="
            while IFS= read -r -d '' file; do
              fname=$(basename "$file")
              # 排除 deb 包内部的 control.tar.gz / data.tar.gz
              if [ "$fname" = "control.tar.gz" ] || [ "$fname" = "data.tar.gz" ]; then
                echo "  Skipping (internal deb file): $fname"
                continue
              fi
              echo "  Copying $fname"
              cp "$file" "$out/"
            done < <(find "$bundle" -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.AppImage' -o -name '*.tar.gz' -o -name '*.sig' \) -print0)
          else
            echo "ERROR: No bundle directory found!"
            find src-tauri/target -maxdepth 4 -name "bundle" -type d 2>/dev/null
          fi

          echo "=== Artifacts ==="
          ls -lh "$out"
          # 选定 updater 主包（优先 AppImage）
          UPDATER_FILE=$(ls "$out"/*.AppImage 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
          UPDATER_FORMAT="appimage"
          if [ -z "$UPDATER_FILE" ]; then
            UPDATER_FILE=$(ls "$out"/*.deb 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
            UPDATER_FORMAT="deb"
          fi
          echo "UPDATER_FILE=$UPDATER_FILE" >> "$GITHUB_OUTPUT"
          echo "UPDATER_FORMAT=$UPDATER_FORMAT" >> "$GITHUB_OUTPUT"

      - name: Collect artifacts (macOS)
        id: collect-macos
        if: matrix.platform == 'macos-latest'
        run: |
          out="${{ matrix.artifact-dir }}"
          mkdir -p "$out"
          for bundle in "src-tauri/target/release/bundle" "src-tauri/target/${{ matrix.target }}/release/bundle"; do
            if [ -d "$bundle" ]; then
              echo "=== Found bundle dir: $bundle ==="
              find "$bundle" -type f
              echo ""
              echo "=== Copying dmg / tar.gz / sig files ==="
              while IFS= read -r -d '' file; do
                fname=$(basename "$file")
                echo "  Copying $fname"
                cp "$file" "$out/"
              done < <(find "$bundle" -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -print0)
            fi
          done
          echo "=== Artifacts ==="
          ls -lh "$out"
          # updater 主包用 dmg
          UPDATER_FILE=$(ls "$out"/*.dmg 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
          UPDATER_FORMAT="dmg"
          if [ -z "$UPDATER_FILE" ]; then
            UPDATER_FILE=$(ls "$out"/*.tar.gz 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
            UPDATER_FORMAT="app"
          fi
          echo "UPDATER_FILE=$UPDATER_FILE" >> "$GITHUB_OUTPUT"
          echo "UPDATER_FORMAT=$UPDATER_FORMAT" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 写入本平台 manifest（给发布 job 汇总成 latest.json）
      # manifest = { key, url_filename, signature, format, size }
      # ------------------------------------------------------------
      - name: Write platform manifest
        id: write-manifest
        shell: bash
        run: |
          OUTDIR="${{ matrix.artifact-dir }}"
          UPDATER_FILE="${{ steps.collect-windows.outputs.UPDATER_FILE }}${{ steps.collect-linux.outputs.UPDATER_FILE }}${{ steps.collect-macos.outputs.UPDATER_FILE }}"
          UPDATER_FORMAT="${{ steps.collect-windows.outputs.UPDATER_FORMAT }}${{ steps.collect-linux.outputs.UPDATER_FORMAT }}${{ steps.collect-macos.outputs.UPDATER_FORMAT }}"
          KEY="${{ matrix.updater-key }}"
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"  # e.g. zhangOranges/RD

          # 读签名内容（.sig 文件）：signature 字段必须是 .sig 的文本内容，不能是 URL
          SIG_CONTENT=""
          if [ -n "$UPDATER_FILE" ] && [ -f "$OUTDIR/${UPDATER_FILE}.sig" ]; then
            SIG_CONTENT=$(cat "$OUTDIR/${UPDATER_FILE}.sig")
          fi

          # 计算文件实际大小（字节，用于前端进度条显示）
          SIZE="0"
          if [ -n "$UPDATER_FILE" ] && [ -f "$OUTDIR/${UPDATER_FILE}" ]; then
            # 跨平台：stat 命令在 macOS/Linux 参数不同，用 wc -c 更稳
            SIZE=$(wc -c < "$OUTDIR/${UPDATER_FILE}" | tr -d ' ')
            # Windows (Git Bash) 的 wc -c 可能输出空行/带空格，兜底用 ls
            if [ -z "$SIZE" ] || [ "$SIZE" = "0" ]; then
              SIZE=$(ls -l "$OUTDIR/${UPDATER_FILE}" | awk '{print $5}')
            fi
          fi

          # URL 格式：GitHub Release 资产下载 URL
          # 注意：GitHub Release 的 assets URL 是
          #   https://github.com/<owner>/<repo>/releases/download/<tag>/<filename>
          URL="https://github.com/${REPO}/releases/download/${TAG}/${UPDATER_FILE}"

          # 组装 JSON（通过临时文件 + node 或 jq 编码，避免 shell 转义问题）
          mkdir -p manifests
          MANIFEST_FILE="manifests/${{ matrix.label }}.json"
          # 将签名中的换行转成 \n，避免 JSON 解析出错
          ESCAPED_SIG=$(printf '%s' "$SIG_CONTENT" | awk '{printf "%s\\n", $0}' | sed 's/\\n$//')
          # 如果 awk 没输出（空签名），兜底用空字符串
          if [ -z "$ESCAPED_SIG" ]; then ESCAPED_SIG=""; fi

          cat > "$MANIFEST_FILE" <<JSONEOF
          {
            "key": "${KEY}",
            "url_filename": "${UPDATER_FILE}",
            "url": "${URL}",
            "signature": "$(echo -n "$SIG_CONTENT" | sed ':a;N;$!ba;s/\n/\\n/g')",
            "format": "${UPDATER_FORMAT}",
            "size": ${SIZE:-0}
          }
          JSONEOF
          cat "$MANIFEST_FILE"
          # 设置 step output：JSON 字符串（单行转义）
          echo "manifest=$(cat "$MANIFEST_FILE" | tr -d '\n' | sed 's/"/\\"/g')" >> "$GITHUB_OUTPUT"

      # ------------------------------------------------------------
      # 上传 artifact：包括平台 manifest
      # ------------------------------------------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: rd-app-${{ matrix.label }}
          path: |
            ${{ matrix.artifact-dir }}/*
            manifests/*.json
          retention-days: 30

  # ------------------------------------------------------------
  # 汇总发布：
  #   1) 下载所有 artifact
  #   2) 组装 latest.json（Tauri updater manifest）
  #   3) 创建 GitHub Release（包含 latest.json + 所有平台产物 + .sig）
  # ------------------------------------------------------------
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      # 先 checkout 仓库（CHANGELOG.md 需要读取）
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: rd-app-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -lh all-artifacts/
          echo "=== manifests dir ==="
          ls -lh all-artifacts/manifests/ 2>/dev/null || echo "(no manifests)"
          cat all-artifacts/manifests/*.json 2>/dev/null || true
          echo "=== Full tree ==="
          find all-artifacts -type f 2>/dev/null | head -50

      - name: Flatten all artifacts to root
        run: |
          cd all-artifacts
          echo "=== Before flatten ==="
          find . -type f | head -30
          # 将所有子目录中的文件复制到根目录
          while IFS= read -r -d '' file; do
            fname=$(basename "$file")
            cp "$file" "./$fname"
          done < <(find . -mindepth 2 -type f -not -path './manifests/*' -print0)
          # 清理子目录（保留 manifests/）
          find . -mindepth 1 -maxdepth 1 -type d -not -name 'manifests' -exec rm -rf {} + 2>/dev/null || true
          echo "=== After flatten ==="
          ls -lh .

      - name: Generate latest.json updater manifest
        run: |
          cd all-artifacts
          export TAG="${GITHUB_REF_NAME}"
          export VERSION="${TAG#v}"  # strip leading v
          export PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # 读取工作区根目录的 CHANGELOG.md（需要 checkout 代码，但这里在 all-artifacts 目录，
          # 所以 CHANGELOG 放在上一级或通过 GITHUB_WORKSPACE 引用）
          export CHANGELOG_PATH="${GITHUB_WORKSPACE}/CHANGELOG.md"
          echo "Looking for CHANGELOG.md at: $CHANGELOG_PATH"
          ls -la "$CHANGELOG_PATH" 2>/dev/null || echo "(no CHANGELOG.md found)"

          node <<'NODEEOF' > latest.json
          const fs = require('fs');
          const path = require('path');

          const tag = process.env.TAG;
          const version = process.env.VERSION;
          const pubDate = process.env.PUB_DATE;
          const repo = process.env.GITHUB_REPOSITORY;
          const changelogPath = process.env.CHANGELOG_PATH;

          /**
           * 解析 CHANGELOG.md，提取指定版本的更新说明。
           * 支持两种常见格式：
           *   ## [x.y.z] - 2024-01-01
           *   ## x.y.z
           *   ## vx.y.z
           *   - 或 tag == v1.2.3 时，搜索 [1.2.3] / 1.2.3 / v1.2.3 三种
           * 返回字符串（纯 markdown，未转义）
           */
          function extractChangelog(filePath, targetVersion) {
            if (!filePath || !fs.existsSync(filePath)) return null;
            try {
              const content = fs.readFileSync(filePath, 'utf8');
              const lines = content.replace(/\r\n/g, '\n').split('\n');

              // 构造候选的标题匹配文本
              const candidates = new Set([
                `[${targetVersion}]`,
                `${targetVersion}`,
                `v${targetVersion}`,
                `[v${targetVersion}]`,
              ]);

              // 找到起始行：形如 "## xxx" 的 markdown H2
              let startIdx = -1;
              for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                const m = line.match(/^##\s+(.+?)\s*$/);
                if (!m) continue;
                const heading = m[1].trim();
                // heading 可能形如 "[1.2.3] - 2025-01-01"，先去掉前缀的 [] 或 纯版本
                // 取空白/连字符前的第一个 token 比较
                const firstToken = heading.split(/\s|-|—/)[0].trim()
                  .replace(/^\[/, '').replace(/\].*$/, '');
                if (candidates.has(firstToken) || candidates.has(heading) || candidates.has(heading.replace(/^\[(.*)\].*$/, '$1'))) {
                  startIdx = i + 1;
                  break;
                }
                // 兜底：整段 heading 包含版本号字符串也匹配
                for (const c of candidates) {
                  if (c.length >= 3 && heading.includes(c.replace(/[\[\]]/g, ''))) {
                    startIdx = i + 1;
                    break;
                  }
                }
                if (startIdx >= 0) break;
              }

              if (startIdx < 0) return null;

              // 找到结束行：下一个 ## H2 或文件尾
              let endIdx = lines.length;
              for (let i = startIdx; i < lines.length; i++) {
                const line = lines[i].trim();
                if (/^##\s+/.test(line)) {
                  endIdx = i;
                  break;
                }
              }
              const section = lines.slice(startIdx, endIdx).join('\n').trim();
              return section.length > 0 ? section : null;
            } catch (e) {
              console.error('Error parsing CHANGELOG:', e.message);
              return null;
            }
          }

          const manifestsDir = 'manifests';
          const platforms = {};

          if (fs.existsSync(manifestsDir)) {
            for (const f of fs.readdirSync(manifestsDir)) {
              if (!f.endsWith('.json')) continue;
              const m = JSON.parse(fs.readFileSync(path.join(manifestsDir, f), 'utf8'));
              if (!m.key || !m.url_filename || !m.signature) {
                console.error(`Skipping incomplete manifest: ${f}`, m);
                continue;
              }
              const entry = {
                signature: m.signature,
                url: m.url,
              };
              if (m.format) entry.format = m.format;
              // 写入 size（字节），用于客户端精确计算下载进度
              if (typeof m.size === 'number' && m.size > 0) {
                entry.size = m.size;
              }
              platforms[m.key] = entry;
            }
          }

          // 从 CHANGELOG.md 取更新说明；无则回退默认
          let notes = extractChangelog(changelogPath, version);
          if (!notes) {
            notes = `## 版本 ${version}\n\n- 更新至最新版 RD 应用。\n- 详细更新记录请前往 GitHub Release 页面查看。`;
          }

          const manifest = {
            version,
            notes,
            pub_date: pubDate,
            platforms,
          };
          process.stdout.write(JSON.stringify(manifest, null, 2));
          NODEEOF

          echo "=== latest.json ==="
          cat latest.json

          # 同时将 notes 写入单独文件，供后续 Create GitHub Release 步骤作为 body 使用（避免重复解析）
          node -e '
            const j = JSON.parse(require("fs").readFileSync("latest.json","utf8"));
            require("fs").writeFileSync("release_body.md", j.notes || "", "utf8");
          ' || true
          echo "=== release_body.md (first 20 lines) ==="
          head -20 release_body.md 2>/dev/null || true

      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: all-artifacts/release_body.md
          files: |
            all-artifacts/*.exe
            all-artifacts/*.msi
            all-artifacts/*.deb
            all-artifacts/*.AppImage
            all-artifacts/*.dmg
            all-artifacts/*.tar.gz
            all-artifacts/*.sig
            all-artifacts/latest.json
            all-artifacts/*/*.exe
            all-artifacts/*/*.msi
            all-artifacts/*/*.deb
            all-artifacts/*/*.AppImage
            all-artifacts/*/*.dmg
            all-artifacts/*/*.tar.gz
            all-artifacts/*/*.sig
            all-artifacts/*/latest.json
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
