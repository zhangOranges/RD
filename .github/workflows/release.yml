name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  # ============================================================
  # 三平台构建（并行）：
  #   macOS ARM64  -> .dmg / .app.tar.gz
  #   Windows x64  -> .msi / .exe
  #   Linux   x64  -> .deb / .AppImage
  # ============================================================
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # --- macOS ARM64 ---
          - platform: macos-latest
            target: aarch64-apple-darwin
            label: macos-arm64
            updater-key: darwin-aarch64
            artifact-dir: artifacts-macos-arm64
            bundles: dmg,app
          # --- Windows x64 ---
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            updater-key: windows-x86_64
            artifact-dir: artifacts-windows-x64
            bundles: nsis
          # --- Linux x64 (glibc) ---
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            updater-key: linux-x86_64
            artifact-dir: artifacts-linux-x64
            bundles: deb,appimage

    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    outputs:
      manifest: ${{ steps.write-manifest.outputs.manifest }}
    steps:
      - uses: actions/checkout@v4

      # ----------------------------
      # 基础环境
      # ----------------------------
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install npm deps
        run: npm install --no-audit --no-fund

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Verify signing key secret
        shell: bash
        run: |
          KEY="${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}"
          if [ -z "$KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is EMPTY. Please configure it in GitHub Secrets."
            exit 1
          fi
          echo "Key length: ${#KEY} chars"

      # ----------------------------
      # Linux 系统依赖（生成 .deb 必需）
      # ----------------------------
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fakeroot dpkg file libwebkit2gtk-4.1-dev \
            build-essential curl wget file libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf desktop-file-utils libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev libgtk-3-dev libgdk-pixbuf2.0-dev

      # ----------------------------
      # Tauri Build
      # ----------------------------
      - name: Tauri build
        run: npm run tauri -- build --target ${{ matrix.target }} -b ${{ matrix.bundles }} --verbose
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # ----------------------------
      # 构建失败诊断
      # ----------------------------
      - name: Diagnose bundle output (on failure)
        if: failure()
        shell: bash
        run: |
          set +e
          echo "=== Environment ==="
          echo "matrix.target=${{ matrix.target }}"
          echo "matrix.bundles=${{ matrix.bundles }}"
          echo "matrix.platform=${{ matrix.platform }}"
          echo ""
          echo "=== All bundle dirs ==="
          find src-tauri/target -name "bundle" -type d 2>/dev/null | head -20 || echo "(none)"
          echo ""
          TRIPLE_DIR="src-tauri/target/${{ matrix.target }}/release"
          echo "--- $TRIPLE_DIR contents ---"
          ls "$TRIPLE_DIR" 2>/dev/null | head -20 || echo "(not found)"
          echo ""
          for bundle in "src-tauri/target/release/bundle" "src-tauri/target/${{ matrix.target }}/release/bundle"; do
            if [ -d "$bundle" ]; then
              echo "=== BUNDLE DIR: $bundle ==="
              ls "$bundle" 2>/dev/null
              find "$bundle" -maxdepth 3 -type f 2>/dev/null | head -60
              echo "--- END ---"
            fi
          done
          echo ""
          echo "=== Installer files anywhere ==="
          find src-tauri/target -maxdepth 6 -type f 2>/dev/null | grep -E '\.(dmg|tar\.gz|sig|app|msi|exe|deb|AppImage)$' | head -40 || echo "(none found)"
          echo "=== Diagnostic complete ==="
          true

      # ----------------------------
      # macOS 产物收集
      # ----------------------------
      - name: Collect artifacts (macOS)
        id: collect-macos
        if: runner.os == 'macOS'
        shell: bash
        run: |
          out="${{ matrix.artifact-dir }}"
          mkdir -p "$out"
          for bundle in "src-tauri/target/release/bundle" "src-tauri/target/${{ matrix.target }}/release/bundle"; do
            if [ -d "$bundle" ]; then
              echo "=== Found bundle dir: $bundle ==="
              find "$bundle" -type f
              while IFS= read -r -d '' file; do
                fname=$(basename "$file")
                echo "  Copying $fname"
                cp "$file" "$out/"
              done < <(find "$bundle" -type f \( -name '*.dmg' -o -name '*.tar.gz' -o -name '*.sig' \) -print0)
            fi
          done
          echo "=== Artifacts ==="
          ls -lh "$out"
          UPDATER_FILE=$(ls "$out"/*.dmg 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
          if [ -z "$UPDATER_FILE" ]; then
            UPDATER_FILE=$(ls "$out"/*.tar.gz 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
          fi
          echo "UPDATER_FILE=$UPDATER_FILE" >> "$GITHUB_OUTPUT"

      # ----------------------------
      # Windows 产物收集
      # ----------------------------
      - name: Collect artifacts (Windows)
        id: collect-windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "${{ matrix.artifact-dir }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $target = "${{ matrix.target }}"
          $bundleDirs = @(
            "src-tauri\target\release\bundle",
            "src-tauri\target\$target\release\bundle"
          )
          foreach ($bd in $bundleDirs) {
            if (Test-Path $bd) {
              Write-Host "=== Found bundle dir: $bd ==="
              Get-ChildItem -Path $bd -Recurse -File | ForEach-Object {
                Write-Host ("  {0}" -f $_.FullName)
                if ($_.Extension -in ".exe",".sig") {
                  Copy-Item $_.FullName -Destination (Join-Path $out $_.Name)
                  Write-Host ("    Copied -> {0}" -f $_.Name)
                }
              }
            }
          }
          Write-Host "=== Artifacts ==="
          Get-ChildItem $out | Format-Table -AutoSize Name,Length
          $updater = Get-ChildItem $out\*.exe 2>$null | Select-Object -First 1
          $updaterFile = if ($updater) { $updater.Name } else { "" }
          echo "UPDATER_FILE=$updaterFile" >> $env:GITHUB_OUTPUT

      # ----------------------------
      # Linux 产物收集
      # ----------------------------
      - name: Collect artifacts (Linux)
        id: collect-linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          out="${{ matrix.artifact-dir }}"
          mkdir -p "$out"
          for bundle in "src-tauri/target/release/bundle" "src-tauri/target/${{ matrix.target }}/release/bundle"; do
            if [ -d "$bundle" ]; then
              echo "=== Found bundle dir: $bundle ==="
              find "$bundle" -type f
              while IFS= read -r -d '' file; do
                fname=$(basename "$file")
                echo "  Copying $fname"
                cp "$file" "$out/"
              done < <(find "$bundle" -type f \( -name '*.deb' -o -name '*.AppImage' -o -name '*.sig' \) -print0)
            fi
          done
          echo "=== Artifacts ==="
          ls -lh "$out"
          UPDATER_FILE=$(ls "$out"/*.deb 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
          if [ -z "$UPDATER_FILE" ]; then
            UPDATER_FILE=$(ls "$out"/*.AppImage 2>/dev/null | head -1 | xargs basename 2>/dev/null || true)
          fi
          echo "UPDATER_FILE=$UPDATER_FILE" >> "$GITHUB_OUTPUT"

      # ----------------------------
      # 生成平台 manifest（给 latest.json 汇总用）
      # ----------------------------
      - name: Write platform manifest
        id: write-manifest
        shell: bash
        run: |
          OUTDIR="${{ matrix.artifact-dir }}"
          # 从对应平台的 collect step 取输出
          if [ "${{ runner.os }}" = "macOS" ]; then
            UPDATER_FILE="${{ steps.collect-macos.outputs.UPDATER_FILE }}"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            UPDATER_FILE="${{ steps.collect-windows.outputs.UPDATER_FILE }}"
          else
            UPDATER_FILE="${{ steps.collect-linux.outputs.UPDATER_FILE }}"
          fi
          # 根据后缀推断 updater format
          case "$UPDATER_FILE" in
            *.dmg)          UPDATER_FORMAT="dmg" ;;
            *.exe)          UPDATER_FORMAT="nsis" ;;
            *.deb)          UPDATER_FORMAT="deb" ;;
            *.AppImage)     UPDATER_FORMAT="appimage" ;;
            *.tar.gz)       UPDATER_FORMAT="app" ;;
            *)              UPDATER_FORMAT="" ;;
          esac
          KEY="${{ matrix.updater-key }}"
          TAG="${GITHUB_REF_NAME}"
          REPO="${GITHUB_REPOSITORY}"
          SIG_CONTENT=""
          if [ -n "$UPDATER_FILE" ] && [ -f "$OUTDIR/${UPDATER_FILE}.sig" ]; then
            SIG_CONTENT=$(cat "$OUTDIR/${UPDATER_FILE}.sig")
          fi
          SIZE="0"
          if [ -n "$UPDATER_FILE" ] && [ -f "$OUTDIR/${UPDATER_FILE}" ]; then
            SIZE=$(wc -c < "$OUTDIR/${UPDATER_FILE}" | tr -d ' ')
            if [ -z "$SIZE" ] || [ "$SIZE" = "0" ]; then
              SIZE=$(ls -l "$OUTDIR/${UPDATER_FILE}" | awk '{print $5}')
            fi
          fi
          mkdir -p manifests
          MANIFEST_FILE="manifests/${{ matrix.label }}.json"
          cat > "$MANIFEST_FILE" <<JSONEOF
          {
            "key": "${KEY}",
            "url_filename": "${UPDATER_FILE}",
            "url": "https://github.com/${REPO}/releases/download/${TAG}/${UPDATER_FILE}",
            "signature": "$(echo -n "$SIG_CONTENT" | sed ':a;N;$!ba;s/\n/\\n/g')",
            "format": "${UPDATER_FORMAT}",
            "size": ${SIZE:-0}
          }
          JSONEOF
          cat "$MANIFEST_FILE"
          echo "manifest=$(cat "$MANIFEST_FILE" | tr -d '\n' | sed 's/"/\\"/g')" >> "$GITHUB_OUTPUT"

      # ----------------------------
      # 上传每平台的 artifact
      # ----------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: rd-app-${{ matrix.label }}
          path: |
            ${{ matrix.artifact-dir }}/*
            manifests/*.json
          retention-days: 30

  # ============================================================
  # 汇总发布 Job
  # ============================================================
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: rd-app-*
          merge-multiple: true
      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -lh all-artifacts/
          echo "=== manifests dir ==="
          ls -lh all-artifacts/manifests/ 2>/dev/null || echo "(no manifests)"
          cat all-artifacts/manifests/*.json 2>/dev/null || true
          echo "=== Full tree ==="
          find all-artifacts -type f 2>/dev/null | head -80
      - name: Flatten all artifacts to root
        run: |
          cd all-artifacts
          echo "=== Before flatten ==="
          find . -type f | head -60
          while IFS= read -r -d '' file; do
            fname=$(basename "$file")
            cp "$file" "./$fname"
          done < <(find . -mindepth 2 -type f -not -path './manifests/*' -print0)
          find . -mindepth 1 -maxdepth 1 -type d -not -name 'manifests' -exec rm -rf {} + 2>/dev/null || true
          echo "=== After flatten ==="
          ls -lh .
      - name: Generate latest.json updater manifest
        run: |
          cd all-artifacts
          export TAG="${GITHUB_REF_NAME}"
          export VERSION="${TAG#v}"
          export PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export CHANGELOG_PATH="${GITHUB_WORKSPACE}/CHANGELOG.md"
          echo "Looking for CHANGELOG.md at: $CHANGELOG_PATH"
          ls -la "$CHANGELOG_PATH" 2>/dev/null || echo "(no CHANGELOG.md found)"
          node <<'NODEEOF' > latest.json
          const fs = require('fs');
          const path = require('path');
          const tag = process.env.TAG;
          const version = process.env.VERSION;
          const pubDate = process.env.PUB_DATE;
          const repo = process.env.GITHUB_REPOSITORY;
          const changelogPath = process.env.CHANGELOG_PATH;
          function extractChangelog(filePath, targetVersion) {
            if (!filePath || !fs.existsSync(filePath)) {
              console.error('CHANGELOG.md not found at:', filePath);
              return null;
            }
            try {
              const content = fs.readFileSync(filePath, 'utf8');
              const lines = content.replace(/\r\n/g, '\n').split('\n');
              const versionRe = /\[?v?(\d+\.\d+\.\d+)\]?/;
              let startIdx = -1;
              for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();
                const m = line.match(/^##\s+(.+?)\s*$/);
                if (!m) continue;
                const heading = m[1].trim();
                const vm = heading.match(versionRe);
                if (vm && vm[1] === targetVersion) {
                  startIdx = i + 1;
                  console.error(`[CHANGELOG] Matched heading: "${heading}" at line ${i + 1}`);
                  break;
                }
              }
              if (startIdx < 0) {
                console.error(`Version ${targetVersion} not found in CHANGELOG.md`);
                const h2s = lines.filter(l => /^##\s+/.test(l.trim()));
                console.error('Available H2 headings:', JSON.stringify(h2s));
                return null;
              }
              let endIdx = lines.length;
              for (let i = startIdx; i < lines.length; i++) {
                const line = lines[i].trim();
                if (/^##\s+/.test(line)) {
                  endIdx = i;
                  break;
                }
              }
              const section = lines.slice(startIdx, endIdx).join('\n').trim();
              return section.length > 0 ? section : null;
            } catch (e) {
              console.error('Error parsing CHANGELOG:', e.message);
              return null;
            }
          }
          const manifestsDir = 'manifests';
          const platforms = {};
          if (fs.existsSync(manifestsDir)) {
            for (const f of fs.readdirSync(manifestsDir)) {
              if (!f.endsWith('.json')) continue;
              const m = JSON.parse(fs.readFileSync(path.join(manifestsDir, f), 'utf8'));
              if (!m.key || !m.url_filename) {
                console.error(`Skipping incomplete manifest: ${f}`, m);
                continue;
              }
              if (!m.signature) {
                console.error(`Warning: manifest ${f} has empty signature, including anyway`);
              }
              const entry = { url: m.url };
              if (m.signature) entry.signature = m.signature;
              if (m.format) entry.format = m.format;
              if (typeof m.size === 'number' && m.size > 0) entry.size = m.size;
              platforms[m.key] = entry;
            }
          }
          let notes = extractChangelog(changelogPath, version);
          if (!notes) {
            notes = `## 版本 ${version}\n\n- 更新至最新版 RD 应用。\n- 详细更新记录请前往 GitHub Release 页面查看。`;
          }
          const manifest = { version, notes, pub_date: pubDate, platforms };
          process.stdout.write(JSON.stringify(manifest, null, 2));
          NODEEOF
          echo "=== latest.json ==="
          cat latest.json
          node -e '
            const j = JSON.parse(require("fs").readFileSync("latest.json","utf8"));
            require("fs").writeFileSync("release_body.md", j.notes || "", "utf8");
          ' || true
          echo "=== release_body.md (first 30 lines) ==="
          head -30 release_body.md 2>/dev/null || true
      - name: Create GitHub Release
        id: gh_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          body_path: all-artifacts/release_body.md
          files: |
            all-artifacts/*.dmg
            all-artifacts/*.tar.gz
            all-artifacts/*.exe
            all-artifacts/*.deb
            all-artifacts/*.AppImage
            all-artifacts/*.sig
            all-artifacts/latest.json
            all-artifacts/*/*.dmg
            all-artifacts/*/*.tar.gz
            all-artifacts/*/*.exe
            all-artifacts/*/*.deb
            all-artifacts/*/*.AppImage
            all-artifacts/*/*.sig
            all-artifacts/*/latest.json
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
