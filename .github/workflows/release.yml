name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # ------------------------------------------------------------
  # 三平台构建：Windows / Linux / macOS (Universal Binary via lipo)
  # 每个 job 只上传 artifact，不直接操作 GitHub Release
  # ------------------------------------------------------------
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            label: windows-x64
            artifact-dir: artifacts-windows
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            label: linux-x64
            artifact-dir: artifacts-linux
          - platform: macos-latest
            target: universal-apple-darwin
            label: macos-universal
            artifact-dir: artifacts-macos

    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci --prefer-offline --no-audit --no-fund

      # ---------- Windows / Linux：直接按 target 构建 ----------
      - name: Setup Rust toolchain (Windows/Linux)
        if: matrix.platform != 'macos-latest'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ---------- macOS：先装基础工具链，再手动装两个架构 target ----------
      - name: Setup Rust toolchain (macOS - base)
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@stable

      - name: Install Rust targets for macOS Universal Binary
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          rustup target list --installed | grep apple

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      - name: Cache cargo registry & target
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      # ---------- macOS：分两步构建 + lipo 合并 ----------
      - name: Tauri build (macOS - aarch64)
        if: matrix.platform == 'macos-latest'
        run: |
          npm run tauri -- build --target aarch64-apple-darwin --verbose
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Save aarch64 build artifacts
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p build-aarch64
          cp -R src-tauri/target/aarch64-apple-darwin/release/bundle build-aarch64/bundle
          # 复制主二进制（按文件名查找，兼容 rd_app / RD 等命名）
          BIN=$(ls src-tauri/target/aarch64-apple-darwin/release/ | grep -v '\.dSYM$' | head -1)
          echo "Detected binary: $BIN"
          cp "src-tauri/target/aarch64-apple-darwin/release/$BIN" build-aarch64/rd_app
          file build-aarch64/rd_app

      - name: Tauri build (macOS - x86_64)
        if: matrix.platform == 'macos-latest'
        run: |
          npm run tauri -- build --target x86_64-apple-darwin --verbose
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: lipo merge and produce Universal Binary
        if: matrix.platform == 'macos-latest'
        run: |
          mkdir -p target/universal-apple-darwin/release

          # 找到 x86_64 二进制
          X64_BIN=$(ls src-tauri/target/x86_64-apple-darwin/release/ | grep -v '\.dSYM$' | head -1)
          echo "x86_64 binary: $X64_BIN"

          # 合并主二进制为 Universal Binary
          lipo -create \
            build-aarch64/rd_app \
            "src-tauri/target/x86_64-apple-darwin/release/$X64_BIN" \
            -output target/universal-apple-darwin/release/rd_app
          echo "=== Universal binary ==="
          file target/universal-apple-darwin/release/rd_app

          # 用 aarch64 的 bundle 作为基础，替换其中的二进制为 Universal
          cp -R build-aarch64/bundle target/universal-bundle
          # 查找 .app 内部的可执行文件路径
          APP_BIN=$(find target/universal-bundle -path '*/Contents/MacOS/*' -type f | head -1)
          echo "App bundle binary: $APP_BIN"
          if [ -n "$APP_BIN" ]; then
            cp target/universal-apple-darwin/release/rd_app "$APP_BIN"
            chmod +x "$APP_BIN"
          fi
          echo "=== Bundled app ==="
          find target/universal-bundle -name '*.app' -maxdepth 3

      # ---------- Windows / Linux：直接构建 ----------
      - name: Tauri build (Windows/Linux)
        if: matrix.platform != 'macos-latest'
        run: npm run tauri -- build --target ${{ matrix.target }} --verbose
        env:
          TAURI_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      # ------------------------------------------------------------
      # 收集产物（各平台分别处理）
      # ------------------------------------------------------------
      - name: Collect artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $bundle = "src-tauri/target/${{ matrix.target }}/release/bundle"
          $out = "${{ matrix.artifact-dir }}"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          if (Test-Path "$bundle/msi")   { Copy-Item "$bundle/msi/*.msi"   -Destination $out -ErrorAction SilentlyContinue }
          if (Test-Path "$bundle/nsis")  { Copy-Item "$bundle/nsis/*.exe"  -Destination $out -ErrorAction SilentlyContinue }
          # portable exe
          if (Test-Path "src-tauri/target/${{ matrix.target }}/release/rd_app.exe") {
            Copy-Item "src-tauri/target/${{ matrix.target }}/release/rd_app.exe" -Destination $out
          }
          Write-Host "=== Artifacts ==="
          Get-ChildItem $out | ForEach-Object { Write-Host "  $($_.Name)" }

      - name: Collect artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          bundle="src-tauri/target/${{ matrix.target }}/release/bundle"
          out="${{ matrix.artifact-dir }}"
          mkdir -p "$out"
          # deb
          find "$bundle/deb" -name '*.deb' -exec cp {} "$out/" 2>/dev/null || true
          # rpm
          find "$bundle/rpm" -name '*.rpm' -exec cp {} "$out/" 2>/dev/null || true
          # AppImage
          find "$bundle/appimage" -name '*.AppImage' -exec cp {} "$out/" 2>/dev/null || true
          echo "=== Artifacts ==="
          ls -lh "$out"

      - name: Collect artifacts (macOS - Universal)
        if: matrix.platform == 'macos-latest'
        run: |
          out="${{ matrix.artifact-dir }}"
          mkdir -p "$out"
          # 把合并后的 Universal .app 打包成 tar.gz
          APP_PATH=$(find target/universal-bundle -name '*.app' -maxdepth 3 | head -1)
          echo "App path: $APP_PATH"
          if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
            APP_NAME=$(basename "$APP_PATH")
            tar -czf "$out/RD-macos-universal.tar.gz" -C "$(dirname "$APP_PATH")" "$APP_NAME"
          fi
          # 放一份 aarch64 的 dmg 作备用
          find build-aarch64/bundle/dmg -name '*.dmg' -exec cp {} "$out/" 2>/dev/null || true
          echo "=== Artifacts ==="
          ls -lh "$out"

      # ------------------------------------------------------------
      # 仅上传 artifact（不再直接操作 GitHub Release）
      # ------------------------------------------------------------
      - uses: actions/upload-artifact@v4
        with:
          name: rd-app-${{ matrix.label }}
          path: ${{ matrix.artifact-dir }}/*
          retention-days: 30

  # ------------------------------------------------------------
  # 汇总发布：下载所有 artifact，一次性创建 GitHub Release
  # ------------------------------------------------------------
  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          pattern: rd-app-*
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          ls -lh all-artifacts/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: all-artifacts/**
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
