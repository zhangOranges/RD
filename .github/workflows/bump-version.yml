name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本递增类型'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: read

jobs:
  bump:
    name: Bump & Release (并行触发 CI + Release)
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.ver.outputs.next }}
      tag: ${{ steps.commit-and-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Read current version & compute next
        id: ver
        run: |
          set -euo pipefail
          CUR=$(node -p "require('./package.json').version")
          echo "当前版本: $CUR"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CUR"
          BUMP="${{ inputs.bump }}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            *) echo "未知 bump 类型: $BUMP"; exit 1 ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "下一版本: $NEXT"
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Bump package.json
        run: |
          node -e "
            const fs = require('fs');
            const p = './package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = '${{ steps.ver.outputs.next }}';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('package.json -> ${{ steps.ver.outputs.next }}');
          "

      - name: Bump src-tauri/Cargo.toml
        run: |
          sed -i -E '0,/^version = ".*"/s/^version = ".*"/version = "${{ steps.ver.outputs.next }}"/' src-tauri/Cargo.toml
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Sync Cargo.lock version (仅修改 rd-app 的版本)
        run: |
          if grep -q 'name = "rd-app"' src-tauri/Cargo.lock; then
            sed -i '/name = "rd-app"/,/version = /s/version = "[^"]*"/version = "${{ steps.ver.outputs.next }}"/' src-tauri/Cargo.lock
            echo "Cargo.lock rd-app version 已同步"
          fi

      - name: Bump src-tauri/tauri.conf.json
        run: |
          node -e "
            const fs = require('fs');
            const p = './src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = '${{ steps.ver.outputs.next }}';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('tauri.conf.json -> ${{ steps.ver.outputs.next }}');
          "

      - name: Verify version consistency
        run: |
          V_PKG=$(node -p "require('./package.json').version")
          V_TF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          V_CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          V_LOCK=$(grep -A2 'name = "rd-app"' src-tauri/Cargo.lock | grep 'version' | sed -E 's/.*"(.*)".*/\1/')
          echo "package.json:      $V_PKG"
          echo "tauri.conf.json:   $V_TF"
          echo "Cargo.toml:        $V_CARGO"
          echo "Cargo.lock rd-app: $V_LOCK"
          if [ "$V_PKG" != "$V_TF" ] || [ "$V_PKG" != "$V_CARGO" ]; then
            echo "::error::版本号不一致"
            exit 1
          fi
          if [ "$V_PKG" != "$V_LOCK" ]; then
            echo "::error::Cargo.lock 中 rd-app 版本号未同步"
            exit 1
          fi
          if [ "$V_PKG" != "${{ steps.ver.outputs.next }}" ]; then
            echo "::error::版本号未正确更新"
            exit 1
          fi
          echo "版本号一致性校验通过"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # 同时 push commit（触发 CI）和 tag（触发 Release），两个工作流并行执行
      - name: Commit to main & push tag (CI + Release 并行触发)
        id: commit-and-tag
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          TAG="v${{ steps.ver.outputs.next }}"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/Cargo.lock
          git commit -m "chore(release): ${{ steps.ver.outputs.next }}

          bump: ${{ inputs.bump }} (${{ steps.ver.outputs.current }} → ${{ steps.ver.outputs.next }})
          由 Bump Version 工作流自动生成。"

          SHA=$(git rev-parse HEAD)
          echo "新 commit: $SHA"

          # 1) Push commit 到 main → 触发 CI 工作流（语法/lint 检查）
          # commit push 用 checkout 自带的 token 即可（CI 不依赖 PAT）
          git push origin "$GITHUB_REF_NAME"
          echo "✅ commit 已推送至 main → CI 工作流已触发"

          # 2) Push tag → 触发 Release 工作流
          # ⚠️  必须使用 GH_PAT (Personal Access Token) 推送 tag！
          #    如果使用 GITHUB_TOKEN，GitHub 出于安全规则不会触发新的 workflow，
          #    导致 Release 工作流完全不启动。
          if [ -z "${GH_PAT:-}" ]; then
            echo "::warning::未检测到 GH_PAT secret，尝试使用 GITHUB_TOKEN 推送 tag"
            echo "::warning::若 Release 未触发，请在仓库 Secrets 中配置 GH_PAT (PAT 需 repo 权限)"
            git tag "$TAG"
            git push origin "$TAG"
          else
            echo "检测到 GH_PAT，使用 PAT 推送 tag 以确保 Release 工作流触发"
            # 使用 PAT 推送 tag：通过 gh api 创建引用，确保使用正确的 token
            git tag "$TAG"
            # 用 PAT 作为认证推送 tag
            REMOTE_URL="https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git"
            git push "$REMOTE_URL" "refs/tags/$TAG"
          fi

          echo "✅ tag $TAG 已推送 → Release 工作流已触发"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          echo "## 版本递增完成 ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项目 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 新版本 | ${{ steps.ver.outputs.next }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 递增类型 | ${{ inputs.bump }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`v${{ steps.ver.outputs.next }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**CI**（前端类型检查 + Rust lint）与 **Release**（macOS ARM64 构建）正在并行执行。" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "> ⚠️ 若 Release 未触发，请在仓库 Secrets 中配置 \`GH_PAT\`（Personal Access Token，需 repo 权限）。" >> "$GITHUB_STEP_SUMMARY"
