name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: '版本递增类型'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write
  actions: read

jobs:
  bump:
    name: Bump & Tag
    runs-on: ubuntu-latest
    outputs:
      next: ${{ steps.ver.outputs.next }}
      tag: ${{ steps.commit-and-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Read current version & compute next
        id: ver
        run: |
          set -euo pipefail
          CUR=$(node -p "require('./package.json').version")
          echo "当前版本: $CUR"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CUR"
          BUMP="${{ inputs.bump }}"
          case "$BUMP" in
            major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR+1)); PATCH=0 ;;
            patch) PATCH=$((PATCH+1)) ;;
            *) echo "未知 bump 类型: $BUMP"; exit 1 ;;
          esac
          NEXT="${MAJOR}.${MINOR}.${PATCH}"
          echo "下一版本: $NEXT"
          echo "current=$CUR" >> "$GITHUB_OUTPUT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Bump package.json
        run: |
          node -e "
            const fs = require('fs');
            const p = './package.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = '${{ steps.ver.outputs.next }}';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('package.json -> ${{ steps.ver.outputs.next }}');
          "

      - name: Bump src-tauri/Cargo.toml
        run: |
          sed -i -E '0,/^version = ".*"/s/^version = ".*"/version = "${{ steps.ver.outputs.next }}"/' src-tauri/Cargo.toml
          grep -m1 '^version' src-tauri/Cargo.toml

      - name: Sync Cargo.lock version (仅修改 rd-app 的版本)
        run: |
          if grep -q 'name = "rd-app"' src-tauri/Cargo.lock; then
            sed -i '/name = "rd-app"/,/version = /s/version = "[^"]*"/version = "${{ steps.ver.outputs.next }}"/' src-tauri/Cargo.lock
            echo "Cargo.lock rd-app version 已同步"
          fi

      - name: Bump src-tauri/tauri.conf.json
        run: |
          node -e "
            const fs = require('fs');
            const p = './src-tauri/tauri.conf.json';
            const j = JSON.parse(fs.readFileSync(p, 'utf8'));
            j.version = '${{ steps.ver.outputs.next }}';
            fs.writeFileSync(p, JSON.stringify(j, null, 2) + '\n');
            console.log('tauri.conf.json -> ${{ steps.ver.outputs.next }}');
          "

      - name: Verify version consistency
        run: |
          V_PKG=$(node -p "require('./package.json').version")
          V_TF=$(node -p "require('./src-tauri/tauri.conf.json').version")
          V_CARGO=$(grep -m1 '^version' src-tauri/Cargo.toml | sed -E 's/.*"(.*)".*/\1/')
          V_LOCK=$(grep -A2 'name = "rd-app"' src-tauri/Cargo.lock | grep 'version' | sed -E 's/.*"(.*)".*/\1/')
          echo "package.json:      $V_PKG"
          echo "tauri.conf.json:   $V_TF"
          echo "Cargo.toml:        $V_CARGO"
          echo "Cargo.lock rd-app: $V_LOCK"
          if [ "$V_PKG" != "$V_TF" ] || [ "$V_PKG" != "$V_CARGO" ]; then
            echo "::error::版本号不一致"
            exit 1
          fi
          if [ "$V_PKG" != "$V_LOCK" ]; then
            echo "::error::Cargo.lock 中 rd-app 版本号未同步"
            exit 1
          fi
          if [ "$V_PKG" != "${{ steps.ver.outputs.next }}" ]; then
            echo "::error::版本号未正确更新"
            exit 1
          fi
          echo "版本号一致性校验通过"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit to main & 创建 tag（暂不推送）
        id: commit-and-tag
        run: |
          TAG="v${{ steps.ver.outputs.next }}"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json src-tauri/Cargo.lock
          git commit -m "chore(release): ${{ steps.ver.outputs.next }}

          bump: ${{ inputs.bump }} (${{ steps.ver.outputs.current }} → ${{ steps.ver.outputs.next }})
          由 Bump Version 工作流自动生成。"
          git push origin "$GITHUB_REF_NAME"
          git tag "$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "已推送 commit 到 main，CI 将被触发。等待 CI 完成后再推送 tag $TAG"

  wait-for-ci:
    name: Wait for CI
    needs: bump
    runs-on: ubuntu-latest
    steps:
      - name: Wait for CI workflow to complete
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "等待 CI 工作流完成 (repo=$REPO)..."
          MAX_WAIT=1800
          WAITED=0
          while [ "$WAITED" -lt "$MAX_WAIT" ]; do
            RUN=$(gh run list \
              --repo "$REPO" \
              --workflow=ci.yml \
              --branch=main \
              --limit=1 \
              --json status,conclusion,databaseId,headSha \
              --jq '.[0]')
            STATUS=$(echo "$RUN" | jq -r '.status')
            CONCLUSION=$(echo "$RUN" | jq -r '.conclusion')
            RUN_ID=$(echo "$RUN" | jq -r '.databaseId')
            SHA=$(echo "$RUN" | jq -r '.headSha')
            echo "CI run #$RUN_ID: status=$STATUS conclusion=$CONCLUSION sha=$SHA (已等待 ${WAITED}s)"
            if [ "$STATUS" = "completed" ]; then
              if [ "$CONCLUSION" = "success" ]; then
                echo "CI 成功完成！"
                exit 0
              else
                echo "::error::CI 工作流失败 (conclusion=$CONCLUSION)，取消发布"
                exit 1
              fi
            fi
            sleep 15
            WAITED=$((WAITED + 15))
          done
          echo "::error::等待 CI 超时（${MAX_WAIT}s）"
          exit 1

  push-tag:
    name: Push Tag (Trigger Release)
    needs: [bump, wait-for-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Push tag
        run: |
          TAG="${{ needs.bump.outputs.tag }}"
          SHA=$(git rev-parse HEAD)
          echo "在 commit $SHA 上创建并推送 tag: $TAG"
          gh api \
            --method POST \
            /repos/${{ github.repository }}/git/refs \
            -f ref="refs/tags/$TAG" \
            -f sha="$SHA" || {
              echo "tag 可能已存在，尝试直接 push"
              git tag "$TAG" "$SHA" 2>/dev/null || true
              git push origin "$TAG" 2>/dev/null || true
            }
          echo "已推送 tag $TAG，Release 工作流将被触发"
        env:
          GH_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "## 版本递增完成 ✅" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| 项目 | 值 |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| 新版本 | ${{ needs.bump.outputs.next }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| 递增类型 | ${{ inputs.bump }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Tag | \`v${{ needs.bump.outputs.next }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "CI 已通过 ✅，tag 已推送，**Release** 工作流正在构建三平台产物。" >> "$GITHUB_STEP_SUMMARY"